<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>左屏学习计时器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101416;
      --panel: #171d20;
      --panel-2: #1e2529;
      --text: #edf3f1;
      --muted: #99a8a5;
      --line: #2e393d;
      --accent: #62d69d;
      --accent-2: #f4c15d;
      --vocabulary: #75bfff;
      --vocabulary-deep: #18344a;
      --distraction: #ff9d73;
      --danger: #ff7a7a;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.26);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      overscroll-behavior-x: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
      overscroll-behavior-x: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 16px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(170px, 0.7fr) minmax(260px, 1.6fr) minmax(160px, 0.7fr);
      gap: 14px;
      align-items: stretch;
    }

    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .subject-panel {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 16px;
      align-items: center;
    }

    .subject-panel-title {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 680;
      white-space: nowrap;
    }

    .subject-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .subject-item {
      min-height: 54px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121719;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .subject-item-name {
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .subject-item-time {
      color: var(--text);
      font-size: 1.18rem;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .subject-item.uncategorized .subject-item-name,
    .subject-item.uncategorized .subject-item-time {
      color: var(--muted);
    }

    .time-box,
    .state-box {
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 104px;
    }

    .date {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .clock {
      margin-top: 6px;
      font-size: 2.15rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .task-box {
      padding: 14px;
      min-height: 104px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .task-main {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .task-input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1.35rem;
      outline: none;
    }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(98, 214, 157, 0.16);
    }

    .task-input:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .task-options {
      display: grid;
      grid-template-columns: minmax(210px, auto) minmax(120px, 0.65fr);
      gap: 10px;
      align-items: stretch;
    }

    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
    }

    .segment-btn {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 720;
    }

    .segment-btn.active {
      background: var(--accent);
      color: #08110d;
    }

    .segment-btn:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .segment-subject {
      grid-column: 1 / -1;
      grid-template-columns: repeat(3, 1fr);
    }

    .meal-select,
    .date-input {
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .meal-select:focus,
    .date-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(98, 214, 157, 0.16);
    }

    .state-title {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .state-value {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .guardian-sync-status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }

    .guardian-sync-status[data-status="connected"] {
      color: var(--accent);
    }

    .guardian-sync-status[data-status="retrying"],
    .guardian-sync-status[data-status="interrupted"],
    .guardian-sync-status[data-status="conflict"] {
      color: var(--accent-2);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .dot.running {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(98, 214, 157, 0.12);
    }

    .dot.vocabulary {
      background: var(--vocabulary);
      box-shadow: 0 0 0 6px rgba(117, 191, 255, 0.14);
    }

    .hero {
      padding: 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      min-height: 236px;
    }

    .timer-setup {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .timer-mode-segment {
      width: min(320px, 100%);
      flex: 0 1 320px;
    }

    .countdown-duration {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
    }

    .countdown-duration[hidden] {
      display: none;
    }

    .countdown-duration-input {
      width: 86px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #151b1e;
      color: var(--text);
      padding: 0 10px;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    .countdown-duration-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(98, 214, 157, 0.16);
    }

    .countdown-duration-input:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .countdown-unit {
      color: var(--muted);
      white-space: nowrap;
    }

    .timer-meta {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .active-task {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.35;
      min-height: 38px;
      overflow-wrap: anywhere;
    }

    .active-edit-actions {
      min-height: 34px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .active-edit-actions[hidden],
    .active-edit-actions .small-btn[hidden] {
      display: none;
    }

    .timer {
      margin-top: 14px;
      font-size: clamp(4.2rem, 8rem, 8rem);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
    }

    .timer.countdown-warning {
      color: var(--accent-2);
    }

    .timer.vocabulary-active {
      color: var(--vocabulary);
    }

    .controls {
      display: grid;
      gap: 12px;
      width: 220px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 62px;
      padding: 0 18px;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
      font-weight: 760;
      font-size: 1.15rem;
    }

    .btn:hover:not(:disabled) {
      border-color: #526266;
      background: #263036;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .btn.primary {
      background: var(--accent);
      color: #08110d;
      border-color: var(--accent);
    }

    .btn.pause {
      background: var(--accent-2);
      color: #151006;
      border-color: var(--accent-2);
    }

    .btn.distraction {
      background: #31241f;
      color: #ffd8c8;
      border-color: #6b493c;
    }

    .btn.distraction:hover:not(:disabled) {
      background: #412d25;
      border-color: var(--distraction);
    }

    .btn.distraction.recorded {
      animation: distraction-recorded 520ms ease-out;
    }

    .btn.vocabulary {
      background: var(--vocabulary-deep);
      color: #d9efff;
      border-color: #32688f;
    }

    .btn.vocabulary:hover:not(:disabled) {
      background: #204762;
      border-color: var(--vocabulary);
    }

    .btn.vocabulary.returning {
      background: var(--vocabulary);
      color: #06131c;
      border-color: var(--vocabulary);
    }

    @keyframes distraction-recorded {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 157, 115, 0.52);
      }
      100% {
        box-shadow: 0 0 0 12px rgba(255, 157, 115, 0);
      }
    }

    .btn.copy {
      min-height: 48px;
      font-size: 1rem;
    }

    .btn.end {
      background: #3a2a2d;
      color: #ffd4d4;
      border-color: #664148;
    }

    .pause-reasons {
      grid-column: 1 / -1;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .pause-reasons[hidden] {
      display: none;
    }

    .reason-title {
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 10px;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .reason-btn {
      min-height: 58px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #20282c;
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 720;
      line-height: 1.25;
    }

    .reason-btn:hover {
      border-color: var(--accent-2);
      background: #293238;
    }

    .custom-reason {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, auto);
      gap: 10px;
      margin-top: 12px;
    }

    .custom-reason-input {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
      color: var(--text);
      padding: 0 14px;
      outline: none;
      font-size: 1rem;
    }

    .custom-reason-input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(244, 193, 93, 0.15);
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #20282c;
      color: var(--text);
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .small-btn:hover {
      border-color: #526266;
      background: #293238;
    }

    .small-btn.delete {
      color: #ffd4d4;
      border-color: #664148;
    }

    .records {
      padding: 16px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .records-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .records-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .record-tools {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .record-group {
      display: grid;
      gap: 10px;
    }

    .record-group + .record-group {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .record-group-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font-weight: 760;
    }

    .record-group-title span {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .meal-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .meal-item {
      min-height: 64px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121719;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .meal-label {
      color: var(--accent-2);
      font-size: 0.9rem;
      font-weight: 760;
    }

    .meal-time {
      color: var(--text);
      font-size: 1rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    h1,
    h2 {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.25;
    }

    .total {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .table-wrap {
      overflow: auto;
      overscroll-behavior-x: contain;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: #121719;
      font-size: 0.92rem;
      font-weight: 650;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      color: var(--text);
      font-size: 1rem;
    }

    .table-wrap th:last-child,
    .table-wrap td:last-child {
      position: sticky;
      right: 0;
      min-width: 140px;
      padding-left: 12px;
      padding-right: 12px;
      box-shadow: inset 1px 0 0 var(--line), -12px 0 16px rgba(0, 0, 0, 0.24);
    }

    .table-wrap tbody td:last-child {
      z-index: 2;
      background: var(--panel);
    }

    .table-wrap thead th:last-child {
      z-index: 3;
    }

    .table-wrap th:last-child .row-actions,
    .table-wrap td:last-child .row-actions {
      flex-wrap: nowrap;
    }

    .vocabulary-cell {
      color: #cbe9ff;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .task-cell {
      overflow-wrap: anywhere;
      min-width: 240px;
    }

    .reason-cell {
      overflow-wrap: anywhere;
      min-width: 210px;
      color: var(--muted);
    }

    .distraction-cell {
      overflow-wrap: anywhere;
      min-width: 230px;
      color: #ffd8c8;
    }

    .output-cell {
      overflow-wrap: anywhere;
      min-width: 280px;
      color: var(--text);
    }

    .evaluation-cell {
      min-width: 126px;
      color: var(--accent);
      font-weight: 720;
      white-space: nowrap;
    }

    .study-table {
      min-width: 1640px;
    }

    .study-table th:nth-child(2),
    .study-table td:nth-child(2) {
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.62);
    }

    .modal[hidden] {
      display: none;
    }

    .modal-card {
      width: min(680px, 100%);
      max-height: min(760px, 92vh);
      overflow: auto;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal-card.compact {
      width: min(460px, 100%);
    }

    .review-context {
      display: grid;
      gap: 5px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121719;
    }

    .review-task {
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 740;
      overflow-wrap: anywhere;
    }

    .review-meta {
      color: var(--muted);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    .review-form {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .evaluation-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .evaluation-btn {
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #20282c;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .evaluation-btn:hover {
      border-color: #526266;
      color: var(--text);
    }

    .evaluation-btn.active {
      border-color: var(--accent);
      background: rgba(98, 214, 157, 0.14);
      color: var(--accent);
    }

    .evaluation-btn:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .review-error {
      min-height: 20px;
      color: var(--danger);
      font-size: 0.92rem;
    }

    .active-edit-field {
      margin-top: 14px;
    }

    .active-edit-error {
      min-height: 20px;
      margin-top: 8px;
      color: var(--danger);
      font-size: 0.92rem;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d1113;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    .field textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .empty {
      color: var(--muted);
      padding: 28px 14px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121719;
    }

    .toast {
      min-height: 22px;
      color: var(--accent);
      font-size: 0.94rem;
    }

    .toast.error {
      color: var(--danger);
    }

    @media (max-width: 820px) {
      .app {
        padding: 14px;
      }

      .topbar,
      .hero,
      .subject-panel {
        grid-template-columns: 1fr;
      }

      .subject-list {
        grid-template-columns: 1fr;
      }

      .controls {
        width: 100%;
        grid-template-columns: 1fr 1fr;
      }

      .reason-grid {
        grid-template-columns: 1fr 1fr;
      }

      .timer {
        font-size: 4.7rem;
      }

      .records-head {
        align-items: stretch;
        flex-direction: column;
      }

      .record-tools {
        justify-content: flex-start;
      }
    }

    @media (max-width: 520px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .task-options,
      .meal-summary {
        grid-template-columns: 1fr;
      }

      .reason-grid {
        grid-template-columns: 1fr;
      }

      .custom-reason {
        grid-template-columns: 1fr;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }

      .evaluation-grid {
        grid-template-columns: 1fr 1fr;
      }

      .timer {
        font-size: 3.7rem;
      }

      .timer-setup,
      .countdown-duration {
        align-items: stretch;
        width: 100%;
      }

      .timer-setup {
        flex-direction: column;
      }

            <button class="segment-btn" type="button" data-subject="english">英语</button>
          </div>
        </div>

            <button id="remoteControlConnectBtn" class="small-btn" type="button">连接</button>

    <section class="box subject-panel" aria-label="三科学习时间">

    <section class="box hero" aria-label="计时器">

            <button id="countDownModeBtn" class="segment-btn" type="button">倒计时</button>

      function parseDateKey(key) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ""));
        if (!match) {

        return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 0, 0, 0, 0);

        });
      }

      function timeText(date) {
        return [pad(date.getHours()), pad(date.getMinutes()), pad(date.getSeconds())].join(":");
      }

      function shortTimeText(date) {
        return [pad(date.getHours()), pad(date.getMinutes())].join(":");
      }

      function monthDayTimeText(date) {
        return [pad(date.getMonth() + 1), "-", pad(date.getDate()), " ", shortTimeText(date)].join("");
      }

      function timeRangeText(entry) {
        const start = new Date(entry.startIso);
        const end = new Date(entry.endIso);
        if (dateKey(start) === dateKey(end)) {
          return shortTimeText(start) + "-" + shortTimeText(end);
        }
        return monthDayTimeText(start) + "-" + monthDayTimeText(end);
      }

      function formatDuration(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return [hours, minutes, seconds].map(pad).join(":");
      }

      function formatCountdownDuration(ms) {
        const roundedMs = Math.ceil(Math.max(0, ms) / 1000) * 1000;
        return formatDuration(roundedMs);
      }

      function getAlarmAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        if (!alarmAudioContext) {
          alarmAudioContext = new AudioContextClass();
        }
        return alarmAudioContext;
      }

      function armCountdownAlarm() {
        const context = getAlarmAudioContext();
        if (!context) {
          return false;
        }
        const resume = context.state === "suspended" ? context.resume() : Promise.resolve();
        resume.then(() => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          gain.gain.setValueAtTime(0.0001, context.currentTime);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start();
          oscillator.stop(context.currentTime + 0.02);
        }).catch(() => {});
        return true;
      }

      function playCountdownAlarm() {
        const context = getAlarmAudioContext();
        if (!context) {
          setToast("倒计时结束，但当前浏览器不支持声音提醒", true);
          return;
        }

        const play = () => {
          const startAt = context.currentTime + 0.03;
          [0, 0.38, 0.76, 1.14].forEach((offset, index) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            const toneAt = startAt + offset;
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(index % 2 ? 740 : 880, toneAt);
            gain.gain.setValueAtTime(0.0001, toneAt);
            gain.gain.exponentialRampToValueAtTime(0.28, toneAt + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, toneAt + 0.29);
            oscillator.connect(gain).connect(context.destination);
            oscillator.start(toneAt);
            oscillator.stop(toneAt + 0.31);
          });
        };

        if (context.state === "suspended") {
          context.resume().then(play).catch(() => {
            setToast("倒计时结束，但声音被浏览器阻止", true);
          });
          return;
        }
        play();
      }

      function safeTask(value) {
        const task = String(value || "").trim();

      function normalizeMaintenanceItem(value) {

        }

      function loadMaintenanceInbox() {

      function normalizeActualOutput(value) {
        return String(value || "").trim().slice(0, MAX_ACTUAL_OUTPUT_LENGTH);
      }

      function normalizeSelfEvaluation(value) {
        return SELF_EVALUATION_LABELS[value] ? value : "";
      }

      function selfEvaluationLabel(value) {

      function defaultMealSlot(date) {
        const hour = date.getHours();
        if (hour < 10) {
          return "breakfast";
        }
        if (hour < 16) {
          return "lunch";
        }
        return "dinner";
      }

      function normalizeKind(kind) {
        return kind === "meal" ? "meal" : "study";
      }

      function normalizeSubject(subject) {
        return SUBJECTS.includes(subject) ? subject : "";
      }

      function subjectLabel(subject) {
        const normalized = normalizeSubject(subject);
        return normalized ? SUBJECT_LABELS[normalized] : "未分类";
      }

      function normalizeTimerMode(mode) {
        return mode === "countdown" ? "countdown" : "countup";
      }

      function normalizeCountdownMinutes(value) {
        const minutes = Math.floor(Number(value));
        if (!Number.isFinite(minutes) || minutes < 1) {
          return DEFAULT_COUNTDOWN_MINUTES;
        }
        return Math.min(minutes, MAX_COUNTDOWN_MINUTES);
      }

      function normalizeTargetMs(value) {
        const targetMs = Number(value);
        if (!Number.isFinite(targetMs) || targetMs <= 0) {
          return DEFAULT_COUNTDOWN_MINUTES * 60 * 1000;
        }
        return Math.min(targetMs, MAX_COUNTDOWN_MINUTES * 60 * 1000);
      }

      function normalizeMealSlot(slot) {
        return MEAL_SLOT_LABELS[slot] ? slot : defaultMealSlot(now());
      }

      function emptyState() {
        return {
          active: null,
          pendingCompletion: null,
          entriesByDate: {},
          lastTask: "",
          lastStudyTask: "",
          lastMealTask: "",
          lastKind: "study",
          lastSubject: "",
          lastMealSlot: defaultMealSlot(now()),
          lastTimerMode: "countup",
          lastCountdownMinutes: DEFAULT_COUNTDOWN_MINUTES,
          selectedDateKey: dateKey(now()),
          guardianRevision: 0,
          guardianEventSeq: 0,
          guardianOutbox: [],
          controlReceipts: []
        };
      }

      function readStoredState() {
        const current = localStorage.getItem(STORAGE_KEY);
        if (current) {
          return current;
        }
        for (const key of LEGACY_STORAGE_KEYS) {
          const legacy = localStorage.getItem(key);
          if (legacy) {
            return legacy;
          }
        }
        return "";
      }

      function loadState() {
        try {
          const raw = readStoredState();
          if (!raw) {
            return emptyState();
          }
          const parsed = JSON.parse(raw);
          const active = normalizeActive(parsed.active);
          const pendingCompletion = normalizePendingCompletion(parsed.pendingCompletion);
          const lastKind = active ? normalizeKind(active.kind) : normalizeKind(parsed.lastKind);
          const lastTimerMode = active ? normalizeTimerMode(active.timerMode) : normalizeTimerMode(parsed.lastTimerMode);
          const guardianOutbox = normalizeGuardianOutbox(parsed.guardianOutbox);
          const highestEventSequence = guardianOutbox.reduce(
            (highest, event) => Math.max(highest, event.client_sequence),
            0
          );
          return {
            active,
            pendingCompletion,
            entriesByDate: normalizeEntriesByDate(parsed.entriesByDate || {}),
            lastTask: parsed.lastTask || "",
            lastStudyTask: parsed.lastStudyTask || (lastKind !== "meal" ? parsed.lastTask || "" : ""),
            lastMealTask: parsed.lastMealTask || (active && lastKind === "meal" ? active.task : (lastKind === "meal" ? parsed.lastTask || "" : "")),
            lastKind,
            lastSubject: normalizeSubject(parsed.lastSubject)
              || (active && lastKind === "study" ? normalizeSubject(active.subject) : ""),
            lastMealSlot: active && lastKind === "meal" ? normalizeMealSlot(active.mealSlot) : normalizeMealSlot(parsed.lastMealSlot),
            lastTimerMode,
            lastCountdownMinutes: active && lastTimerMode === "countdown"
              ? normalizeCountdownMinutes(Math.ceil(normalizeTargetMs(active.targetMs) / 60000))
              : normalizeCountdownMinutes(parsed.lastCountdownMinutes),
            selectedDateKey: /^\d{4}-\d{2}-\d{2}$/.test(parsed.selectedDateKey || "") ? parsed.selectedDateKey : dateKey(now()),
            guardianRevision: Number.isFinite(Number(parsed.guardianRevision))
              ? Math.max(0, Number(parsed.guardianRevision))
              : 0,
            guardianEventSeq: Math.max(
              highestEventSequence,
              Number.isFinite(Number(parsed.guardianEventSeq))
                ? Math.max(0, Math.floor(Number(parsed.guardianEventSeq)))
                : 0
            ),
            guardianOutbox,
            controlReceipts: Array.isArray(parsed.controlReceipts) ? parsed.controlReceipts.filter((receipt) =>
              receipt && typeof receipt.key === "string" && receipt.key.length <= 160
              && typeof receipt.fingerprint === "string" && receipt.fingerprint.length <= 600
              && receipt.result && receipt.result.completed === true
            ).slice(-32) : []
          };
        } catch (error) {
          return emptyState();
        }
      }

      function normalizeGuardianSignal(candidate) {
        if (!candidate || typeof candidate !== "object") {
          return null;
        }
        const type = String(candidate.type || "");
        const eventId = String(candidate.event_id || "").slice(0, 160);
        const clientSequence = Math.max(0, Math.floor(Number(candidate.client_sequence || 0)));
        const occurredAt = String(candidate.occurred_at || "").slice(0, 64);
        if (
          !eventId
          || !GUARDIAN_SIGNAL_TYPES.has(type)
          || !Number.isFinite(clientSequence)
          || clientSequence <= 0
          || !Number.isFinite(new Date(occurredAt).getTime())
        ) {
          return null;
        }
        const nonNegativeNumber = (value) => {
          const number = Number(value);
          return Number.isFinite(number) ? Math.max(0, number) : 0;
        };
        return {
          event_id: eventId,
          client_sequence: clientSequence,
          type,
          occurred_at: occurredAt,
          block_id: String(candidate.block_id || "").slice(0, 96),
          started_at: String(candidate.started_at || "").slice(0, 64),
          task: String(candidate.task || "").slice(0, 240),
          study_ms: nonNegativeNumber(candidate.study_ms),
          break_ms: nonNegativeNumber(candidate.break_ms),
          distraction_ordinal: Math.max(0, Math.floor(nonNegativeNumber(candidate.distraction_ordinal))),
          transition_code: String(candidate.transition_code || "").slice(0, 64),
          source_code: String(candidate.source_code || "").slice(0, 64),
          related_event_id: String(candidate.related_event_id || "").slice(0, 160),
          user_reason_code: String(candidate.user_reason_code || "").slice(0, 64)
        };
      }

      function normalizeGuardianOutbox(outbox) {
        if (!Array.isArray(outbox)) {
          return [];
        }
        const seen = new Set();
        return outbox.map(normalizeGuardianSignal).filter((event) => {
          if (!event || seen.has(event.event_id)) {
            return false;
          }
          seen.add(event.event_id);
          return true;
        }).sort((left, right) => left.client_sequence - right.client_sequence);
      }

      function loadGuardianSync() {
        try {
          const parsed = JSON.parse(localStorage.getItem(GUARDIAN_SYNC_KEY) || "null");
          if (!parsed || typeof parsed !== "object") {
            throw new Error("missing sync state");
          }
          return {
            lastAckAt: Math.max(0, Number(parsed.lastAckAt || 0)),
            lastErrorCode: String(parsed.lastErrorCode || "").slice(0, 64),
            retryAt: Math.max(0, Number(parsed.retryAt || 0)),
            failureStartedAt: Math.max(0, Number(parsed.failureStartedAt || 0))
          };
        } catch (error) {
          return { lastAckAt: 0, lastErrorCode: "", retryAt: 0, failureStartedAt: 0 };
        }
      }

      function persistGuardianSync() {
        localStorage.setItem(GUARDIAN_SYNC_KEY, JSON.stringify(guardianSync));
      }

      function readWriterLease() {
        try {
          const lease = JSON.parse(localStorage.getItem(WRITER_LEASE_KEY) || "null");
          if (
            lease
            && typeof lease === "object"
            && typeof lease.tabId === "string"
            && Number.isFinite(Number(lease.expiresAt))
          ) {
            return {
              tabId: lease.tabId,
              expiresAt: Number(lease.expiresAt)
            };
          }
        } catch (error) {
          return null;
        }
        return null;
      }

      function currentTabOwnsWriterLease() {
        const lease = readWriterLease();
        return Boolean(lease && lease.tabId === writerTabId && lease.expiresAt > Date.now());
      }

      function tryAcquireWriterLease() {
        const currentMs = Date.now();
        const lease = readWriterLease();
        if (lease && lease.tabId !== writerTabId && lease.expiresAt > currentMs) {
          writerLeaseOwned = false;
          return false;
        }
        const candidate = {
          tabId: writerTabId,
          expiresAt: currentMs + WRITER_LEASE_TTL_MS
        };
        localStorage.setItem(WRITER_LEASE_KEY, JSON.stringify(candidate));
        writerLeaseOwned = currentTabOwnsWriterLease();
        return writerLeaseOwned;
      }

      function ensureWriterLease() {
        if (currentTabOwnsWriterLease()) {
          localStorage.setItem(WRITER_LEASE_KEY, JSON.stringify({
            tabId: writerTabId,
            expiresAt: Date.now() + WRITER_LEASE_TTL_MS
          }));
          writerLeaseOwned = currentTabOwnsWriterLease();
          return writerLeaseOwned;
        }
        writerLeaseOwned = false;
        return tryAcquireWriterLease();
      }

      function renewOrAcquireWriterLease() {
        const wasWriter = writerLeaseOwned;
        ensureWriterLease();
        if (writerLeaseOwned && !wasWriter) {
          state = loadState();
          scheduleGuardianMirror(0);
        }
        if (writerLeaseOwned !== wasWriter) {
          renderAll();
        } else {
          updateGuardianSyncStatus();
        }
        return writerLeaseOwned;
      }

      function releaseWriterLease() {
        if (!currentTabOwnsWriterLease()) {
          writerLeaseOwned = false;
          return;
        }
        localStorage.removeItem(WRITER_LEASE_KEY);
        writerLeaseOwned = false;
      }

      function applyWriterMode() {
        const leaseOnlyControls = [
          editActiveTaskBtn,
          editPauseReasonBtn,
          customPauseReasonInput,
          customPauseReasonBtn,
          blockReviewOutput,
          blockReviewSave,
          maintenanceTitleInput,
          maintenanceNoteInput,
          maintenanceSave,
          editSave,
          activeEditSave,
          viewDateInput,
          prevDateBtn,
          todayBtn,
          nextDateBtn
        ];
        leaseOnlyControls.forEach((control) => {
          if (control) {
            control.disabled = !writerLeaseOwned;
          }
        });
        document.querySelectorAll("[data-action], [data-reason], [data-evaluation]").forEach((control) => {
          control.disabled = !writerLeaseOwned;
        });
        if (writerLeaseOwned) {
          return;
        }
        [
          taskInput,
          studyKindBtn,
          mealKindBtn,
          mealSlotInput,
          ...subjectButtons,
          countUpModeBtn,
          countDownModeBtn,
          countdownMinutesInput,
          startBtn,
          pauseBtn,
          vocabularyBtn,
          distractionBtn,
          endBtn,
          blockReviewSave,
          editActiveTaskBtn,
