          deferMaintenanceBtn,
          maintenanceTitleInput,
          maintenanceNoteInput,
          maintenanceSave
        ].forEach((control) => {
          if (control) {
            control.disabled = true;
          }
        });
      }

      function atomicTimerWritesAvailable() {
        return Boolean(navigator.locks && typeof navigator.locks.request === "function");
      }

      async function runTimerMutation(callback) {
        const commit = () => {
          if (!ensureWriterLease()) {
            state = loadState();
            return { ok: false, error: "not_original_writer" };
          }
          const storedBefore = readStoredState();
          state = loadState();
          const baseRevision = Number(state.guardianRevision || 0);
          const cursorBefore = [globalShortcutSessionId, globalShortcutLastEventId];
          timerWriteActive = true;
          timerWriteDirty = false;
          timerWriteSemantic = false;
          timerWriteCursorDirty = false;
          let value;
          let changed = false;
          try {
            value = callback();
            if (value && typeof value.then === "function") throw new Error("async_state_mutation");
            if (timerWriteDirty) {
              if (!currentTabOwnsWriterLease() || readStoredState() !== storedBefore) throw new Error("state_changed_during_commit");
              state.guardianRevision = timerWriteSemantic
                ? Math.max(Date.now(), baseRevision + 1) : baseRevision;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              changed = true;
            }
            if (timerWriteCursorDirty) writeGlobalShortcutCursor();
          } catch (_error) {
            state = loadState();
            [globalShortcutSessionId, globalShortcutLastEventId] = cursorBefore;
            setToast("状态未保存，请核对原计时器后重试", true);
            value = { ok: false, error: "commit_failed" };
          } finally {
            const semantic = timerWriteSemantic;
            timerWriteActive = false;
            timerWriteDirty = false;
            timerWriteSemantic = false;
            timerWriteCursorDirty = false;
            if (changed && semantic) scheduleGuardianMirror();
            if (changed && controlTransport) queueMicrotask(() => controlTransport.publish());
          }
          renderAll();
          return value;
        };
        if (!atomicTimerWritesAvailable()) return commit();
        return navigator.locks.request(TIMER_WRITE_LOCK, { mode: "exclusive", ifAvailable: true }, (lock) => {
          if (!lock) { setToast("另一计时操作正在完成，请稍后重试", true); return { ok: false, error: "busy" }; }
          return commit();
        });
      }

      function persistStateWithoutSemanticRevision() {
        if (!timerWriteActive) { void runTimerMutation(persistStateWithoutSemanticRevision); return; }
        timerWriteDirty = true;
      }

      function enqueueGuardianSignal(type, occurredAtMs, options = {}) {
        if (!state.active || normalizeKind(state.active.kind) !== "study" || !GUARDIAN_SIGNAL_TYPES.has(type)) {
          return "";
        }
        const eventId = String(options.eventId || createGuardianEventId());
        state.guardianOutbox = normalizeGuardianOutbox(state.guardianOutbox);
        if (state.guardianOutbox.some((event) => event.event_id === eventId)) {
          return eventId;
        }
        const atMs = Number.isFinite(Number(occurredAtMs)) ? Number(occurredAtMs) : Date.now();
        state.guardianEventSeq = Math.max(0, Math.floor(Number(state.guardianEventSeq || 0))) + 1;
        const signal = normalizeGuardianSignal({
          event_id: eventId,
          client_sequence: state.guardianEventSeq,
          type,
          occurred_at: new Date(atMs).toISOString(),
          block_id: state.active.blockId,
          started_at: state.active.startIso,
          task: safeTask(state.active.task),
          study_ms: activeStudyMs(atMs),
          break_ms: activeBreakMs(atMs),
          distraction_ordinal: options.distractionOrdinal || 0,
          transition_code: options.transitionCode || "",
          source_code: options.sourceCode || "timer_button",
          related_event_id: options.relatedEventId || "",
          user_reason_code: options.userReasonCode || ""
        });
        if (!signal) {
          return "";
        }
        state.guardianOutbox.push(signal);
        return eventId;
      }

      function acknowledgeGuardianSignals(eventIds) {
        const acknowledged = new Set(Array.isArray(eventIds) ? eventIds : []);
        if (!acknowledged.size) return 0;
        const before = normalizeGuardianOutbox(state.guardianOutbox);
        state.guardianOutbox = before.filter((event) => !acknowledged.has(event.event_id));
        if (before.length !== state.guardianOutbox.length) persistStateWithoutSemanticRevision();
        return before.length - state.guardianOutbox.length;
      }

      function pauseReasonCode(reason, custom) {
        if (custom) {
          return "custom_private";
        }
        const codes = {
          "上厕所": "personal_bathroom",
          "装水": "hydration",
          "打飞机": "private_break",
          "看 Twitter 休息": "social_media_break",
          "看 B 站休息": "video_break",
          "看微信休息": "messaging_break",
          "看微信视频号休息": "short_video_break",
          "跟家人聊天休息": "family_conversation",
          "处理杂七杂八的事情休息": "misc_tasks",
          "发呆休息": "mind_wandering"
        };
        return codes[String(reason || "")] || "preset_other";
      }

      function normalizeDistractions(distractions) {
        if (!Array.isArray(distractions)) {
          return [];
        }
        return distractions.map((distraction) => {
          if (!distraction || typeof distraction !== "object") {
            return null;
          }
          const atMs = typeof distraction.atMs === "number"
            ? distraction.atMs
            : new Date(distraction.atIso).getTime();
          if (!Number.isFinite(atMs)) {
            return null;
          }
          return {
            ...distraction,
            atIso: distraction.atIso || new Date(atMs).toISOString(),
            atMs
          };
        }).filter(Boolean);
      }

      function normalizeVocabularySessions(sessions) {
        if (!Array.isArray(sessions)) {
          return [];
        }
        return sessions.map((session) => {
          if (!session || typeof session !== "object") {
            return null;
          }
          const startMs = typeof session.startMs === "number"
            ? session.startMs
            : new Date(session.startIso).getTime();
          const endMs = typeof session.endMs === "number"
            ? session.endMs
            : new Date(session.endIso).getTime();
          if (!Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs) {
            return null;
          }
          return {
            startIso: session.startIso || new Date(startMs).toISOString(),
            endIso: session.endIso || new Date(endMs).toISOString(),
            startMs,
            endMs,
            durationMs: Math.max(0, endMs - startMs)
          };
        }).filter(Boolean).sort((left, right) => left.startMs - right.startMs);
      }

      function normalizeCurrentVocabulary(session) {
        if (!session || typeof session !== "object") {
          return null;
        }
        const startMs = typeof session.startMs === "number"
          ? session.startMs
          : new Date(session.startIso).getTime();
        if (!Number.isFinite(startMs)) {
          return null;
        }
        return {
          startIso: session.startIso || new Date(startMs).toISOString(),
          startMs
        };
      }

      function normalizeEntry(entry) {
        const kind = normalizeKind(entry.kind);
        const timerMode = normalizeTimerMode(entry.timerMode);
        const startMs = typeof entry.startMs === "number" ? entry.startMs : new Date(entry.startIso).getTime();
        const endMs = typeof entry.endMs === "number" ? entry.endMs : new Date(entry.endIso).getTime();
        return {
          ...entry,
          id: String(entry.id || Date.now()),
          blockId: String(entry.blockId || entry.id || `legacy-${startMs}`),
          kind,
          timerMode,
          targetMs: timerMode === "countdown" ? normalizeTargetMs(entry.targetMs) : 0,
          countdownCompleted: timerMode === "countdown" && Boolean(entry.countdownCompleted),
          endedWhileRunning: entry.endedWhileRunning === true,
          mealSlot: kind === "meal" ? normalizeMealSlot(entry.mealSlot) : "",
          subject: kind === "study" ? normalizeSubject(entry.subject) : "",
          task: safeTask(entry.task),
          actualOutput: kind === "study" ? normalizeActualOutput(entry.actualOutput) : "",
          selfEvaluation: kind === "study" ? normalizeSelfEvaluation(entry.selfEvaluation) : "",
          startMs,
          endMs,
          pauses: Array.isArray(entry.pauses) ? entry.pauses : [],
          vocabularySessions: normalizeVocabularySessions(entry.vocabularySessions),
          distractions: normalizeDistractions(entry.distractions)
        };
      }

      function normalizePendingCompletion(pendingCompletion) {
        if (!pendingCompletion || typeof pendingCompletion !== "object") {
          return null;
        }
        const candidate = pendingCompletion.entry;
        if (!candidate || typeof candidate !== "object") {
          return null;
        }
        const entry = normalizeEntry(candidate);
        if (
          normalizeKind(entry.kind) !== "study"
          || !Number.isFinite(entry.startMs)
          || !Number.isFinite(entry.endMs)
          || entry.endMs < entry.startMs
        ) {
          return null;
        }
        return {
          entry,
          countdownComplete: Boolean(pendingCompletion.countdownComplete),
          createdAtIso: String(pendingCompletion.createdAtIso || new Date(entry.endMs).toISOString())
        };
      }

      function normalizeEntriesByDate(entriesByDate) {
        const normalized = {};
        for (const [key, entries] of Object.entries(entriesByDate || {})) {
          normalized[key] = Array.isArray(entries) ? entries.map(normalizeEntry) : [];
        }
        return normalized;
      }

      function normalizeActive(active) {
        if (!active) {
          return null;
        }
        if (Array.isArray(active.runs)) {
          active.pauses = Array.isArray(active.pauses) ? active.pauses : [];
          active.vocabularySessions = normalizeVocabularySessions(active.vocabularySessions);
          active.currentVocabulary = normalizeCurrentVocabulary(active.currentVocabulary);
          active.distractions = normalizeDistractions(active.distractions);
          active.pendingPauseChoice = active.pendingPauseChoice || null;
          active.currentPause = active.currentPause || null;
          active.kind = normalizeKind(active.kind);
          active.timerMode = normalizeTimerMode(active.timerMode);
          active.targetMs = active.timerMode === "countdown" ? normalizeTargetMs(active.targetMs) : 0;
          active.mealSlot = active.kind === "meal" ? normalizeMealSlot(active.mealSlot) : "";
          active.subject = active.kind === "study" ? normalizeSubject(active.subject) : "";
          active.task = safeTask(active.task);
          active.blockId = String(active.blockId || `legacy-${active.startMs || new Date(active.startIso).getTime()}`);
          if (active.currentVocabulary) {
            const lastRun = active.runs[active.runs.length - 1];
            if (lastRun && typeof lastRun.endMs !== "number") {
              lastRun.endMs = active.currentVocabulary.startMs;
              lastRun.endIso = active.currentVocabulary.startIso;
            }
          }
          return active;
        }
        const kind = normalizeKind(active.kind);
        return {
          task: safeTask(active.task),
          kind,
          timerMode: "countup",
          targetMs: 0,
          mealSlot: kind === "meal" ? normalizeMealSlot(active.mealSlot) : "",
          subject: kind === "study" ? normalizeSubject(active.subject) : "",
          blockId: String(active.blockId || `legacy-${active.startMs || new Date(active.startIso).getTime()}`),
          startIso: active.startIso,
          startMs: active.startMs || new Date(active.startIso).getTime(),
          runs: [{ startIso: active.startIso, startMs: active.startMs || new Date(active.startIso).getTime() }],
          pauses: [],
          vocabularySessions: [],
          currentVocabulary: null,
          distractions: [],
          pendingPauseChoice: active.pendingPause ? {
            startIso: active.pendingPause.endIso,
            startMs: active.pendingPause.endMs
          } : null,
          currentPause: null
        };
      }

      function saveState() {
        if (!timerWriteActive) {
          setToast("计时写入入口无效，请重新核对原页面", true);
          return false;
        }
        timerWriteDirty = true;
        timerWriteSemantic = true;
        return true;
      }

      function guardianTimerPayload() {
        guardianHeartbeatSeq = Math.max(
          Date.now(),
          guardianHeartbeatSeq + 1,
          Number(state.guardianRevision || 0)
        );
        const todayKey = dateKey(now());
        const todayEntries = (state.entriesByDate[todayKey] || [])
          .filter((entry) => normalizeKind(entry.kind) !== "meal");
        const recentCompleted = Object.values(state.entriesByDate || {})
          .flatMap((entries) => Array.isArray(entries) ? entries : [])
          .filter((entry) => normalizeKind(entry.kind) !== "meal")
          .sort((left, right) => Number(left.endMs || 0) - Number(right.endMs || 0))
          .slice(-10);
        const latestCompleted = recentCompleted.length
          ? recentCompleted[recentCompleted.length - 1]
          : null;
        const active = state.active && normalizeKind(state.active.kind) === "study"
          ? {
              kind: "study",
              block_id: state.active.blockId,
              task: safeTask(state.active.task),
              timer_mode: normalizeTimerMode(state.active.timerMode),
              start_iso: state.active.startIso,
              running: isLearningActivityRunning(),
              current_pause: state.active.currentPause
                ? {
                    start_iso: state.active.currentPause.startIso
                  }
                : null,
              study_ms: activeStudyMs(),
              break_ms: activeBreakMs(),
              distraction_count: distractionCount(state.active)
            }
          : null;

        return {
          schema: "left_screen_study_timer_guardian_v1",
          exported_at: new Date().toISOString(),
          client_id: guardianClientId,
          revision: Number(state.guardianRevision || 0),
          heartbeat_ms: guardianHeartbeatSeq,
          signals: normalizeGuardianOutbox(state.guardianOutbox).slice(0, 64),
          active,
          latest_completed: latestCompleted
            ? {
                id: latestCompleted.id,
                block_id: latestCompleted.blockId,
                kind: "study",
                task: safeTask(latestCompleted.task),
                started_at: latestCompleted.startIso,
                ended_at: latestCompleted.endIso,
                study_ms: entryStudyMs(latestCompleted),
                break_ms: entryBreakMs(latestCompleted),
                gross_ms: Math.max(0, Number(latestCompleted.endMs || 0) - Number(latestCompleted.startMs || 0)),
                ended_while_running: latestCompleted.endedWhileRunning === true,
                distraction_count: distractionCount(latestCompleted)
              }
            : null,
          recent_completed: recentCompleted.map((entry) => ({
            id: entry.id,
            block_id: entry.blockId,
            kind: "study",
            task: safeTask(entry.task),
            started_at: entry.startIso,
            ended_at: entry.endIso,
            study_ms: entryStudyMs(entry),
            break_ms: entryBreakMs(entry),
            gross_ms: Math.max(0, Number(entry.endMs || 0) - Number(entry.startMs || 0)),
            ended_while_running: entry.endedWhileRunning === true,
            distraction_count: distractionCount(entry)
          })),
          today: {
            date: todayKey,
            completed_blocks: todayEntries.length,
            study_ms: todayEntries.reduce((sum, entry) => sum + entryStudyMs(entry), 0),
            break_ms: todayEntries.reduce((sum, entry) => sum + entryBreakMs(entry), 0),
            distraction_count: todayEntries.reduce((sum, entry) => sum + distractionCount(entry), 0)
          }
        };
      }

      function updateGuardianSyncStatus() {
        if (!writerLeaseOwned) {
          guardianSyncStatus.dataset.status = "retrying";
          guardianSyncStatus.textContent = "只读，等待自动接管";
          guardianSyncStatus.title = "另一计时器标签页正在维护学习值守连接";
          return;
        }
        const currentMs = Date.now();
        const failureStartedAt = guardianSync.failureStartedAt || guardianSync.lastAckAt || guardianPageStartedAt;
        const failureSeconds = Math.max(0, Math.floor((currentMs - failureStartedAt) / 1000));
        let status = "retrying";
        let text = "自动重连中";
        if (guardianSync.lastErrorCode === "stale_revision") {
          status = "conflict";
          text = "另一标签页较新";
        } else if (!guardianSync.lastErrorCode && guardianSync.lastAckAt > 0) {
          status = "connected";
          text = "值守已连接";
        } else if (failureSeconds * 1000 >= GUARDIAN_SUSTAINED_FAILURE_MS) {
          status = "interrupted";
          text = "同步中断 " + failureSeconds + " 秒";
        }
        guardianSyncStatus.dataset.status = status;
        guardianSyncStatus.textContent = text;
        guardianSyncStatus.title = guardianSync.lastErrorCode
          ? "错误代码：" + guardianSync.lastErrorCode
          : "计时器会自动维持与学习值守的连接";
        if (
          guardianSync.lastErrorCode
          && failureSeconds * 1000 >= GUARDIAN_SUSTAINED_FAILURE_MS
          && !guardianFailureToastShown
        ) {
          guardianFailureToastShown = true;
          setToast("学习值守同步持续中断，正在自动重连", true);
        }
      }

      function recordGuardianFailure(code, retryDelayMs) {
        const currentMs = Date.now();
        guardianSync.lastErrorCode = String(code || "unknown_error").slice(0, 64);
        guardianSync.failureStartedAt = guardianSync.failureStartedAt || currentMs;
        guardianSync.retryAt = currentMs + Math.max(0, Number(retryDelayMs || 0));
        persistGuardianSync();
        updateGuardianSyncStatus();
      }

      function recordGuardianSuccess() {
        guardianSync = {
          lastAckAt: Date.now(),
          lastErrorCode: "",
          retryAt: 0,
          failureStartedAt: 0
        };
        guardianRetryIndex = 0;
        guardianFailureToastShown = false;
        persistGuardianSync();
        updateGuardianSyncStatus();
      }

      function guardianRequestError(code) {
        const error = new Error(String(code || "guardian_request_failed"));
        error.guardianCode = String(code || "guardian_request_failed");
        return error;
      }

      async function mirrorGuardianState() {
        window.clearTimeout(guardianMirrorTimeoutId);
        guardianMirrorTimeoutId = null;
        if (!ensureWriterLease()) {
          updateGuardianSyncStatus();
          return;
        }
        if (guardianMirrorInFlight) {
          guardianMirrorPending = true;
          return;
        }
        guardianMirrorInFlight = true;
        guardianMirrorPending = false;
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), GUARDIAN_REQUEST_TIMEOUT_MS);
        const payload = guardianTimerPayload();
        const submittedEventIds = payload.signals.map((event) => event.event_id);
        let nextDelayMs = GUARDIAN_HEARTBEAT_MS;
        try {
          const response = await fetch(GUARDIAN_TIMER_ENDPOINT, {
            method: "POST",
            mode: "cors",
            cache: "no-store",
            credentials: "omit",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          let result;
          try {
            result = await response.json();
          } catch (error) {
            throw guardianRequestError("invalid_bridge_response");
          }
          if (!response.ok || !result || result.ok !== true) {
            throw guardianRequestError(
              result && result.error ? result.error : "http_" + response.status
            );
          }
          const acknowledgedEventIds = Array.isArray(result.acked_event_ids)
            ? result.acked_event_ids.map((eventId) => String(eventId || "")).filter(Boolean)
            : [];
          await runTimerMutation(() => acknowledgeGuardianSignals(acknowledgedEventIds));
          const acknowledged = new Set(acknowledgedEventIds);
          const conflicted = new Set(
            Array.isArray(result.conflict_event_ids)
              ? result.conflict_event_ids.map((eventId) => String(eventId || "")).filter(Boolean)
              : []
          );
          const rejected = new Set(
            Array.isArray(result.rejected_event_ids)
              ? result.rejected_event_ids.map((eventId) => String(eventId || "")).filter(Boolean)
              : []
          );
          if (submittedEventIds.some((eventId) => conflicted.has(eventId))) {
            throw guardianRequestError("event_conflict");
          }
          if (submittedEventIds.some((eventId) => rejected.has(eventId))) {
            throw guardianRequestError("event_rejected");
          }
          if (submittedEventIds.some((eventId) => !acknowledged.has(eventId))) {
            throw guardianRequestError("event_ack_incomplete");
          }
          if (result.accepted !== true) {
            const reason = String(result.reason || "state_not_accepted");
            if (reason === "stale_revision") {
              recordGuardianFailure("stale_revision", GUARDIAN_HEARTBEAT_MS);
              nextDelayMs = GUARDIAN_HEARTBEAT_MS;
              return;
            }
            throw guardianRequestError(reason);
          }

          guardianSync.lastAckAt = Date.now();
          recordGuardianSuccess();
          if (normalizeGuardianOutbox(state.guardianOutbox).length > 0) {
            guardianMirrorPending = true;
          }
        } catch (error) {
          const errorCode = error && error.name === "AbortError"
            ? "request_timeout"
            : String(error && error.guardianCode || "network_error");
          nextDelayMs = GUARDIAN_RETRY_DELAYS_MS[
            Math.min(guardianRetryIndex, GUARDIAN_RETRY_DELAYS_MS.length - 1)
          ];
          guardianRetryIndex = Math.min(
            guardianRetryIndex + 1,
            GUARDIAN_RETRY_DELAYS_MS.length - 1
          );
          recordGuardianFailure(errorCode, nextDelayMs);
        } finally {
          window.clearTimeout(timeoutId);
          guardianMirrorInFlight = false;
          if (guardianMirrorPending) {
            guardianMirrorPending = false;
            scheduleGuardianMirror(0);
          } else {
            scheduleGuardianMirror(nextDelayMs);
          }
        }
      }

      function scheduleGuardianMirror(delayMs = 250) {
        if (guardianMirrorInFlight) {
          guardianMirrorPending = true;
          return;
        }
        window.clearTimeout(guardianMirrorTimeoutId);
        guardianMirrorTimeoutId = window.setTimeout(
          mirrorGuardianState,
          Math.max(0, Number(delayMs || 0))
        );
      }

      function sendGuardianPagehideSnapshot() {
        if (guardianPageHideSent || !currentTabOwnsWriterLease()) {
          return;
        }
        guardianPageHideSent = true;
        const body = JSON.stringify(guardianTimerPayload());
        let sent = false;
        try {
          if (typeof navigator.sendBeacon === "function") {
            sent = navigator.sendBeacon(
              GUARDIAN_TIMER_ENDPOINT,
              new Blob([body], { type: "text/plain;charset=UTF-8" })
            );
          }
        } catch (error) {
          sent = false;
        }
        if (!sent) {
          fetch(GUARDIAN_TIMER_ENDPOINT, {
            method: "POST",
            mode: "cors",
            cache: "no-store",
            credentials: "omit",
            keepalive: true,
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body
          }).catch(() => {
            recordGuardianFailure("pagehide_send_failed", GUARDIAN_RETRY_DELAYS_MS[0]);
          });
        }
      }

      function selectedDateKey() {
        return state.selectedDateKey || dateKey(now());
      }

      function setSelectedDateKey(key) {
        if (!timerWriteActive) { void runTimerMutation(() => setSelectedDateKey(key)); return; }
        state.selectedDateKey = /^\d{4}-\d{2}-\d{2}$/.test(key || "") ? key : dateKey(now());
        saveState();
        renderRecords();
      }

      function currentEntries() {
        const key = selectedDateKey();
        return state.entriesByDate[key] || [];
      }

      function setToast(message, isError) {
        toast.textContent = message || "";
        toast.classList.toggle("error", Boolean(isError));
        if (message) {
          window.clearTimeout(setToast.timer);
          setToast.timer = window.setTimeout(() => {
            toast.textContent = "";
            toast.classList.remove("error");
          }, 3000);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function isRunning() {
        if (!state.active) {
          return false;
        }
        return !state.active.pendingPauseChoice
          && !state.active.currentPause
          && !state.active.currentVocabulary;
      }

      function isVocabularyActive() {
        return Boolean(state.active && state.active.currentVocabulary);
      }

      function isLearningActivityRunning() {
        return isRunning() || isVocabularyActive();
      }

      function runDuration(run, fallbackMs) {
        const endMs = typeof run.endMs === "number" ? run.endMs : fallbackMs;
        return Math.max(0, endMs - run.startMs);
      }

      function pauseDuration(pause, fallbackMs) {
        const endMs = typeof pause.endMs === "number" ? pause.endMs : fallbackMs;
        return Math.max(0, endMs - pause.startMs);
      }

      function vocabularyDuration(session, fallbackMs) {
        const endMs = typeof session.endMs === "number" ? session.endMs : fallbackMs;
        return Math.max(0, endMs - session.startMs);
      }

      function activePrimaryStudyMs(atMs = Date.now()) {
        if (!state.active) {
          return 0;
        }
        const current = Number.isFinite(Number(atMs)) ? Number(atMs) : Date.now();
        return state.active.runs.reduce((sum, run) => sum + runDuration(run, current), 0);
      }

      function activeVocabularyMs(atMs = Date.now()) {
        if (!state.active) {
          return 0;
        }
        const current = Number.isFinite(Number(atMs)) ? Number(atMs) : Date.now();
        const finished = normalizeVocabularySessions(state.active.vocabularySessions)
          .reduce((sum, session) => sum + vocabularyDuration(session, session.endMs), 0);
        const currentSession = state.active.currentVocabulary
          ? vocabularyDuration(state.active.currentVocabulary, current)
          : 0;
        return finished + currentSession;
      }

      function activeStudyMs(atMs = Date.now()) {
        return activePrimaryStudyMs(atMs) + activeVocabularyMs(atMs);
      }

      function countdownCompletionEndMs(active) {
        const targetMs = normalizeTargetMs(active.targetMs);
        let accumulatedMs = 0;
        for (const run of active.runs) {
          const runEndMs = typeof run.endMs === "number" ? run.endMs : Date.now();
          const durationMs = runDuration(run, runEndMs);
          if (accumulatedMs + durationMs >= targetMs) {
            return run.startMs + Math.max(0, targetMs - accumulatedMs);
          }
          accumulatedMs += durationMs;
        }
        return Date.now();
      }

      function completeCountdownIfNeeded() {
        if (!state.active || normalizeTimerMode(state.active.timerMode) !== "countdown" || !isRunning()) {
          return false;
        }
        if (activePrimaryStudyMs() < normalizeTargetMs(state.active.targetMs)) {
          return false;
        }
        if (!timerWriteActive) {
          void runTimerMutation(completeCountdownIfNeeded);
          return false;
        }
        endSession(countdownCompletionEndMs(state.active), { countdownComplete: true });
        return true;
      }

      function activeBreakMs(atMs = Date.now()) {
        if (!state.active) {
          return 0;
        }
        const current = Number.isFinite(Number(atMs)) ? Number(atMs) : Date.now();
        const finished = state.active.pauses.reduce((sum, pause) => sum + pauseDuration(pause, current), 0);
        const currentPause = state.active.currentPause ? pauseDuration(state.active.currentPause, current) : 0;
        return finished + currentPause;
      }

      function entryStudyMs(entry) {
        if (typeof entry.studyMs === "number") {
          return entry.studyMs;
        }
        return typeof entry.durationMs === "number" ? entry.durationMs : Math.max(0, entry.endMs - entry.startMs);
      }

      function entryVocabularyMs(entry) {
        if (typeof entry.vocabularyMs === "number") {
          return Math.max(0, entry.vocabularyMs);
        }
        return normalizeVocabularySessions(entry.vocabularySessions)
          .reduce((sum, session) => sum + vocabularyDuration(session, session.endMs), 0);
      }

      function entryPrimaryStudyMs(entry) {
        if (typeof entry.primaryStudyMs === "number") {
          return Math.max(0, entry.primaryStudyMs);
        }
        return Math.max(0, entryStudyMs(entry) - entryVocabularyMs(entry));
      }

      function entryBreakMs(entry) {
        if (typeof entry.breakMs === "number") {
          return entry.breakMs;
        }
        if (Array.isArray(entry.pauses)) {
          return entry.pauses.reduce((sum, pause) => sum + pauseDuration(pause, pause.endMs), 0);
        }
        return 0;
      }

      function entryGrossMs(entry) {
        if (typeof entry.grossMs === "number") {
          return entry.grossMs;
        }
        return Math.max(0, entry.endMs - entry.startMs);
      }

      function pauseSummary(entry) {
        if (Array.isArray(entry.pauses) && entry.pauses.length) {
          return entry.pauses.map((pause) => {
            const start = new Date(pause.startIso);
            const end = new Date(pause.endIso);
            return shortTimeText(start) + "-" + shortTimeText(end) + " " + pause.reason;
          }).join("；");
        }
        if (entry.pauseReason) {
          return entry.pauseReason;
        }
        return "无";
      }

      function vocabularySummary(entry) {
        const sessions = normalizeVocabularySessions(entry.vocabularySessions);
        if (!sessions.length) {
          const totalMs = entryVocabularyMs(entry);
          return totalMs ? "合计 " + formatDuration(totalMs) + "｜明细未记录" : "无";
        }
        const startDateKey = dateKey(new Date(entry.startIso));
        const ranges = sessions.map((session) => {
          const start = new Date(session.startIso);
          const end = new Date(session.endIso);
          const startText = dateKey(start) === startDateKey ? shortTimeText(start) : monthDayTimeText(start);
          const endText = dateKey(end) === startDateKey ? shortTimeText(end) : monthDayTimeText(end);
          return startText + "-" + endText;
        });
        return "合计 " + formatDuration(entryVocabularyMs(entry)) + "｜" + ranges.join("；");
      }

      function distractionSummary(entry) {
        const distractions = normalizeDistractions(entry.distractions);
        if (!distractions.length) {
          return "无";
        }
        const startDateKey = dateKey(new Date(entry.startIso));
        const times = distractions.map((distraction) => {
          const date = new Date(distraction.atIso);
          return dateKey(date) === startDateKey ? timeText(date) : monthDayTimeText(date) + ":" + pad(date.getSeconds());
        });
        return distractions.length + " 次｜" + times.join("、");
      }

      function distractionCount(entry) {
        return normalizeDistractions(entry.distractions).length;
      }

      function entryLabel(entry) {
        const kind = normalizeKind(entry.kind);
        if (kind === "meal") {
          return "吃饭｜" + MEAL_SLOT_LABELS[normalizeMealSlot(entry.mealSlot)];
        }
        const subject = normalizeSubject(entry.subject);
        return subject ? "学习｜" + SUBJECT_LABELS[subject] : "学习";
      }

      function entryTitle(entry) {
        return entryLabel(entry) + "｜" + safeTask(entry.task);
      }

      function renderKindControls(locked) {
        const kind = normalizeKind(state.lastKind);
        studyKindBtn.classList.toggle("active", kind === "study");
        mealKindBtn.classList.toggle("active", kind === "meal");
        taskInput.disabled = Boolean(locked);
        studyKindBtn.disabled = Boolean(locked);
        mealKindBtn.disabled = Boolean(locked);
        mealSlotInput.disabled = Boolean(locked) || kind !== "meal";
        mealSlotInput.value = normalizeMealSlot(state.lastMealSlot);
        const subject = normalizeSubject(state.lastSubject);
        subjectButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.subject === subject);
          button.disabled = Boolean(locked) || kind !== "study";
        });
      }

      function renderTimerModeControls(locked) {
        const timerMode = state.active
          ? normalizeTimerMode(state.active.timerMode)
          : state.pendingCompletion
            ? normalizeTimerMode(state.pendingCompletion.entry.timerMode)
            : normalizeTimerMode(state.lastTimerMode);
        const countdownMinutes = state.active && timerMode === "countdown"
          ? normalizeCountdownMinutes(Math.ceil(normalizeTargetMs(state.active.targetMs) / 60000))
          : state.pendingCompletion && timerMode === "countdown"
            ? normalizeCountdownMinutes(Math.ceil(normalizeTargetMs(state.pendingCompletion.entry.targetMs) / 60000))
            : normalizeCountdownMinutes(state.lastCountdownMinutes);

        countUpModeBtn.classList.toggle("active", timerMode === "countup");
        countDownModeBtn.classList.toggle("active", timerMode === "countdown");
        countUpModeBtn.disabled = Boolean(locked);
        countDownModeBtn.disabled = Boolean(locked);
        countdownDurationField.hidden = timerMode !== "countdown";
        countdownMinutesInput.disabled = Boolean(locked);
        if (document.activeElement !== countdownMinutesInput || locked) {
          countdownMinutesInput.value = String(countdownMinutes);
        }
      }

      function setTimerMode(mode) {
        if (!timerWriteActive) { void runTimerMutation(() => setTimerMode(mode)); return; }
        if (state.active || state.pendingCompletion) {
          return;
        }
        countdownCompletionDisplayUntil = 0;
        state.lastTimerMode = normalizeTimerMode(mode);
        saveState();
        renderTimer();
      }

      function updateCountdownMinutes() {
        if (!timerWriteActive) { void runTimerMutation(() => updateCountdownMinutes()); return; }
        if (state.active || state.pendingCompletion) {
          return false;
        }
        const value = Math.floor(Number(countdownMinutesInput.value));
        if (!Number.isFinite(value) || value < 1 || value > MAX_COUNTDOWN_MINUTES) {
          return false;
        }
        countdownCompletionDisplayUntil = 0;
        state.lastCountdownMinutes = value;
        saveState();
        renderTimer();
        return true;
      }

      function normalizeCountdownInput() {
        if (!timerWriteActive) { void runTimerMutation(() => normalizeCountdownInput()); return; }
        if (state.active || state.pendingCompletion) {
          return;
        }
        countdownCompletionDisplayUntil = 0;
        state.lastCountdownMinutes = normalizeCountdownMinutes(countdownMinutesInput.value);
        countdownMinutesInput.value = String(state.lastCountdownMinutes);
        saveState();
        renderTimer();
      }

      function setEntryKind(kind) {
        if (!timerWriteActive) { void runTimerMutation(() => setEntryKind(kind)); return; }
        if (state.active || state.pendingCompletion) {
          return;
        }
        const previousKind = normalizeKind(state.lastKind);
        const currentTask = String(taskInput.value || "").trim();
        if (previousKind === "meal") {
          state.lastMealTask = currentTask;
        } else {
          state.lastStudyTask = currentTask;
        }
        state.lastKind = normalizeKind(kind);
        if (state.lastKind === "meal" && !MEAL_SLOT_LABELS[state.lastMealSlot]) {
          state.lastMealSlot = defaultMealSlot(now());
        }
        taskInput.value = state.lastKind === "meal" ? state.lastMealTask || "" : state.lastStudyTask || "";
        saveState();
        renderTimer();
      }

      function setMealSlot(slot) {
        if (!timerWriteActive) { void runTimerMutation(() => setMealSlot(slot)); return; }
        if (state.active || state.pendingCompletion) {
          return;
        }
        state.lastMealSlot = normalizeMealSlot(slot);
        saveState();
        renderTimer();
      }

      function setEntrySubject(subject) {
        if (!timerWriteActive) { void runTimerMutation(() => setEntrySubject(subject)); return; }
        if (state.active || state.pendingCompletion) {
          return;
        }
        state.lastSubject = normalizeSubject(subject);
        saveState();
        renderTimer();
      }

      function newEntryTask(kind, slot) {
        const task = String(taskInput.value || "").trim();
        if (task) {
          return task;
        }
        return kind === "meal" ? MEAL_SLOT_LABELS[slot] : "未标注任务";
      }

      function renderClock() {
        const current = now();
        todayDate.textContent = current.toLocaleDateString("zh-CN", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        });
        liveClock.textContent = timeText(current);
      }

      function renderTimerContents() {
        const controlsLocked = Boolean(state.active || state.pendingCompletion);
        renderKindControls(controlsLocked);
        renderTimerModeControls(controlsLocked);
        stateDot.classList.remove("running", "vocabulary");
        timerDisplay.classList.remove("countdown-warning", "vocabulary-active");
        vocabularyBtn.hidden = true;
        vocabularyBtn.classList.remove("returning");
        vocabularyBtn.textContent = "去背单词";
        vocabularyBtn.title = "暂停原学习块并开始记录背单词时间";
        if (!state.active) {
          if (state.pendingCompletion) {
            const pendingEntry = state.pendingCompletion.entry;
            const countdownCompleted = normalizeTimerMode(pendingEntry.timerMode) === "countdown"
              && pendingEntry.countdownCompleted;
            const vocabularyMs = entryVocabularyMs(pendingEntry);
            timerDisplay.textContent = countdownCompleted ? "00:00:00" : formatDuration(entryPrimaryStudyMs(pendingEntry));
            timerMeta.textContent = (countdownCompleted ? "倒计时结束" : "本段已结束")
              + (vocabularyMs ? "｜背词 " + formatDuration(vocabularyMs) : "")
              + "｜请填写实际产出和执行评价";
            activeTask.textContent = entryTitle(pendingEntry);
            stateText.textContent = "等待本段复盘";
            startBtn.textContent = "开始";
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            pauseBtn.classList.remove("pause");
            distractionBtn.textContent = "分心";
            distractionBtn.disabled = true;
            activeEditActions.hidden = true;
            editPauseReasonBtn.hidden = true;
            endBtn.disabled = true;
            pauseReasonPanel.hidden = true;
            return;
          }
          const previewTimerMode = normalizeTimerMode(state.lastTimerMode);
          const previewTargetMs = normalizeCountdownMinutes(state.lastCountdownMinutes) * 60 * 1000;
          const showingCountdownCompletion = previewTimerMode === "countdown" && Date.now() < countdownCompletionDisplayUntil;
          timerDisplay.textContent = showingCountdownCompletion
            ? "00:00:00"
            : previewTimerMode === "countdown"
              ? formatCountdownDuration(previewTargetMs)
              : "00:00:00";
          timerMeta.textContent = showingCountdownCompletion
            ? "倒计时结束"
            : previewTimerMode === "countdown"
              ? "等待开始｜倒计时 " + formatDuration(previewTargetMs)
              : "等待开始";
          const previewKind = normalizeKind(state.lastKind);
          const previewSlot = normalizeMealSlot(state.lastMealSlot);
          activeTask.textContent = previewKind === "meal"
            ? "吃饭｜" + MEAL_SLOT_LABELS[previewSlot] + "｜" + newEntryTask(previewKind, previewSlot)
            : safeTask(taskInput.value || state.lastStudyTask || state.lastTask);
          stateText.textContent = showingCountdownCompletion ? "已到点" : "未开始";
          startBtn.textContent = "开始";
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          pauseBtn.classList.remove("pause");
          distractionBtn.textContent = "分心";
          distractionBtn.disabled = true;
          activeEditActions.hidden = true;
          editPauseReasonBtn.hidden = true;
          endBtn.disabled = true;
          pauseReasonPanel.hidden = true;
          return;
        }

        const start = new Date(state.active.startIso);
        const primaryStudyMs = activePrimaryStudyMs();
        const vocabularyMs = activeVocabularyMs();
        const breakMs = activeBreakMs();
        const distractions = normalizeDistractions(state.active.distractions);
        const isStudy = normalizeKind(state.active.kind) === "study";
        const vocabularyActive = isVocabularyActive();
        deferMaintenanceBtn.hidden = !isStudy;
        deferMaintenanceBtn.disabled = !writerLeaseOwned || Boolean(state.active.pendingPauseChoice) || vocabularyActive;
        const timerMode = normalizeTimerMode(state.active.timerMode);
        const targetMs = timerMode === "countdown" ? normalizeTargetMs(state.active.targetMs) : 0;
        const remainingMs = timerMode === "countdown" ? Math.max(0, targetMs - primaryStudyMs) : 0;
        timerDisplay.textContent = vocabularyActive
          ? formatDuration(vocabularyDuration(state.active.currentVocabulary, Date.now()))
          : timerMode === "countdown"
            ? formatCountdownDuration(remainingMs)
            : formatDuration(primaryStudyMs);
        timerDisplay.classList.toggle("countdown-warning", !vocabularyActive && timerMode === "countdown" && remainingMs <= 60000);
        timerDisplay.classList.toggle("vocabulary-active", vocabularyActive);
        activeTask.textContent = vocabularyActive
          ? "背单词｜原任务：" + safeTask(state.active.task)
          : entryTitle(state.active);
        activeEditActions.hidden = false;
        editActiveTaskBtn.textContent = isStudy ? "修改学习标题" : "修改事项";
        editPauseReasonBtn.hidden = !state.active.currentPause;
        distractionBtn.textContent = distractions.length ? "分心 · " + distractions.length : "分心";
        distractionBtn.disabled = !isStudy || !isRunning();
        endBtn.disabled = Boolean(state.active.pendingPauseChoice) || vocabularyActive;
        vocabularyBtn.hidden = !isStudy || (!isRunning() && !vocabularyActive);
        vocabularyBtn.disabled = !writerLeaseOwned || (!isRunning() && !vocabularyActive);
        vocabularyBtn.textContent = vocabularyActive ? "结束背词并继续" : "去背单词";
        vocabularyBtn.title = vocabularyActive
          ? "保存本次背词时间并继续原学习块"
          : "暂停原学习块并开始记录背单词时间";
        vocabularyBtn.classList.toggle("returning", vocabularyActive);

        if (state.active.pendingPauseChoice) {
          timerMeta.textContent = "暂停于 " + timeText(new Date(state.active.pendingPauseChoice.startIso)) + "，请选择原因";
          stateText.textContent = "等待选择暂停原因";
          startBtn.disabled = true;
          pauseBtn.disabled = true;
          pauseBtn.classList.remove("pause");
          pauseReasonPanel.hidden = false;
          return;
        }

        if (state.active.currentPause) {
          timerMeta.textContent = "暂停中：" + state.active.currentPause.reason + "｜休息 " + formatDuration(pauseDuration(state.active.currentPause, Date.now()));
          stateText.textContent = timerMode === "countdown" ? "倒计时暂停中" : "暂停中";
          startBtn.textContent = "继续";
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          pauseBtn.classList.remove("pause");
          pauseReasonPanel.hidden = true;
          return;
        }

        if (vocabularyActive) {
          const frozenAt = timerMode === "countdown"
            ? "原倒计时剩余 " + formatCountdownDuration(remainingMs)
            : "原任务已计时 " + formatDuration(primaryStudyMs);
          timerMeta.textContent = "背词合计 " + formatDuration(vocabularyMs) + "｜" + frozenAt;
          stateText.textContent = "背单词中";
          stateDot.classList.add("vocabulary");
          startBtn.textContent = "开始";
          startBtn.disabled = true;
          pauseBtn.disabled = true;
          pauseBtn.classList.remove("pause");
          distractionBtn.disabled = true;
          pauseReasonPanel.hidden = true;
          return;
        }

        const distractionMeta = isStudy
          ? distractions.length
            ? "｜分心 " + distractions.length + " 次，最近 " + timeText(new Date(distractions[distractions.length - 1].atIso))
            : "｜分心 0 次"
          : "";
        const timerModeMeta = timerMode === "countdown"
          ? "倒计时目标 " + formatDuration(targetMs)
          : "本段开始于 " + timeText(start);
        const vocabularyMeta = vocabularyMs ? "｜背词合计 " + formatDuration(vocabularyMs) : "";
        timerMeta.textContent = timerModeMeta + "｜休息合计 " + formatDuration(breakMs) + vocabularyMeta + distractionMeta;
        stateText.textContent = timerMode === "countdown" ? "倒计时中" : "计时中";
        stateDot.classList.add("running");
        startBtn.textContent = "开始";
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        pauseBtn.classList.add("pause");
        pauseReasonPanel.hidden = true;
      }

      function renderTimer() {
        renderTimerContents();
        applyWriterMode();
      }

      function updateReviewEvaluationButtons() {
        blockReviewEvaluation.querySelectorAll("[data-evaluation]").forEach((button) => {
          const selected = button.dataset.evaluation === selectedSelfEvaluation;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-checked", selected ? "true" : "false");
        });
      }

      function renderBlockReview() {
        const pending = state.pendingCompletion;
        if (!pending) {
          blockReviewModal.hidden = true;
          reviewingEntryId = null;
          selectedSelfEvaluation = "";
          blockReviewError.textContent = "";
          return;
        }

        const entry = pending.entry;
        const vocabularyMs = entryVocabularyMs(entry);
        blockReviewTask.textContent = safeTask(entry.task);
        blockReviewMeta.textContent = timeRangeText(entry)
          + "｜净学习 " + formatDuration(entryStudyMs(entry))
          + (vocabularyMs ? "（背词 " + formatDuration(vocabularyMs) + "）" : "")
          + "｜休息 " + formatDuration(entryBreakMs(entry));

        if (reviewingEntryId !== entry.id) {
          reviewingEntryId = entry.id;
          blockReviewOutput.value = normalizeActualOutput(entry.actualOutput);
          selectedSelfEvaluation = normalizeSelfEvaluation(entry.selfEvaluation);
          blockReviewError.textContent = "";
          window.requestAnimationFrame(() => {
            if (!blockReviewModal.hidden && writerLeaseOwned) {
              blockReviewOutput.focus();
            }
          });
        }
        updateReviewEvaluationButtons();
        blockReviewModal.hidden = false;
      }

      function entryActions(entry) {
        return '<div class="row-actions"><button class="small-btn" type="button" data-action="edit" data-id="' + escapeHtml(entry.id) + '">编辑</button><button class="small-btn delete" type="button" data-action="delete" data-id="' + escapeHtml(entry.id) + '">删除</button></div>';
      }

      function renderMealSummary(mealEntries) {
        const items = MEAL_SLOTS.map((slot) => {
          const slotEntries = mealEntries
            .filter((entry) => normalizeMealSlot(entry.mealSlot) === slot)
            .sort((a, b) => a.startMs - b.startMs);
          const timeTextValue = slotEntries.length
            ? slotEntries.map(timeRangeText).join("；")
            : "未记录";
          return [
            '<div class="meal-item">',
            '<div class="meal-label">' + MEAL_SLOT_LABELS[slot] + "</div>",
            '<div class="meal-time">' + escapeHtml(timeTextValue) + "</div>",
            "</div>"
          ].join("");
        }).join("");
        return '<div class="meal-summary">' + items + "</div>";
      }

      function renderStudyTable(studyEntries) {
        if (!studyEntries.length) {
          return '<div class="empty">本日还没有学习记录</div>';
        }
        const rows = studyEntries.slice().sort((a, b) => b.startMs - a.startMs).map((entry) => [
          "<tr>",
          "<td>" + escapeHtml(timeRangeText(entry)) + "</td>",
          "<td>" + escapeHtml(entrySubjectSummary(entry)) + "</td>",
          "<td>" + formatDuration(entryGrossMs(entry)) + "</td>",
          "<td>" + formatDuration(entryStudyMs(entry)) + "</td>",
          "<td>" + formatDuration(entryBreakMs(entry)) + "</td>",
          '<td class="task-cell">' + escapeHtml(entry.task) + "</td>",
          '<td class="output-cell">' + escapeHtml(entry.actualOutput || "未填写") + "</td>",
          '<td class="evaluation-cell">' + escapeHtml(selfEvaluationLabel(entry.selfEvaluation)) + "</td>",
          '<td class="distraction-cell">' + escapeHtml(distractionSummary(entry)) + "</td>",
          '<td class="reason-cell">' + escapeHtml(pauseSummary(entry)) + "</td>",
          "<td>" + entryActions(entry) + "</td>",
          "</tr>"
        ].join("")).join("");

        return [
          '<div class="table-wrap">',
          '<table class="study-table">',
          "<thead><tr><th>时间段</th><th>科目</th><th>总窗口</th><th>净学习</th><th>休息</th><th>任务</th><th>实际产出</th><th>执行自评</th><th>分心记录</th><th>暂停明细</th><th>操作</th></tr></thead>",
          "<tbody>",
          rows,
          "</tbody>",
          "</table>",
          "</div>"
        ].join("");
      }

      function renderMealTable(mealEntries) {
        if (!mealEntries.length) {
          return '<div class="empty">本日还没有吃饭记录</div>';
        }
        const rows = mealEntries.slice().sort((a, b) => b.startMs - a.startMs).map((entry) => [
          "<tr>",
          "<td>" + MEAL_SLOT_LABELS[normalizeMealSlot(entry.mealSlot)] + "</td>",
          "<td>" + escapeHtml(timeRangeText(entry)) + "</td>",
          "<td>" + formatDuration(entryGrossMs(entry)) + "</td>",
          '<td class="task-cell">' + escapeHtml(entry.task) + "</td>",
          "<td>" + entryActions(entry) + "</td>",
          "</tr>"
        ].join("")).join("");

        return [
          '<div class="table-wrap">',
          "<table>",
          "<thead><tr><th>餐次</th><th>时间段</th><th>用时</th><th>备注</th><th>操作</th></tr></thead>",
          "<tbody>",
          rows,
          "</tbody>",
          "</table>",
          "</div>"
        ].join("");
      }

      function renderMaintenanceInbox(key) {
        const items = maintenanceItemsForDate(key);
        if (!items.length) {
          return '<div class="empty">本日没有稍后维护事项</div>';
        }
        const rows = items.map((item) => [
          "<tr>",
          "<td>" + escapeHtml(timeText(new Date(item.createdAt))) + "</td>",
          '<td class="task-cell">' + escapeHtml(item.task) + "</td>",
          '<td class="output-cell">' + escapeHtml(item.title) + "</td>",
          '<td class="reason-cell">' + escapeHtml(item.note || "无") + "</td>",
          '<td><div class="row-actions"><button class="small-btn delete" type="button" data-action="maintenance-remove" data-id="' + escapeHtml(item.id) + '">移除</button></div></td>',
          "</tr>"
        ].join("")).join("");
        return [
          '<div class="table-wrap">',
          "<table>",
          "<thead><tr><th>记录时间</th><th>当时任务</th><th>维护事项</th><th>现象</th><th>操作</th></tr></thead>",
          "<tbody>",
          rows,
          "</tbody>",
          "</table>",
          "</div>"
        ].join("");
      }

      function subjectTotalsByEntry(studyEntries) {
        const totals = new Map();
        let uncategorizedMs = 0;
        for (const entry of studyEntries) {
          if (normalizeKind(entry.kind) === "meal") {
            continue;
          }
          const studyMs = Math.max(0, entryStudyMs(entry));
          // Vocabulary is included in net study already; move its share to English.
          const vocabularyMs = Math.min(studyMs, entryVocabularyMs(entry));
          const primaryMs = studyMs - vocabularyMs;
          const subject = normalizeSubject(entry.subject);
          if (subject) {
            totals.set(subject, (totals.get(subject) || 0) + primaryMs);
          } else {
            uncategorizedMs += primaryMs;
          }
          totals.set("english", (totals.get("english") || 0) + vocabularyMs);
        }
        return { totals, uncategorizedMs };
      }

      function entrySubjectSummary(entry) {
        const { totals, uncategorizedMs } = subjectTotalsByEntry([entry]);
        const parts = SUBJECTS.filter((subject) => totals.get(subject) > 0)
          .map((subject) => SUBJECT_LABELS[subject] + " " + formatDuration(totals.get(subject)));
        if (uncategorizedMs) parts.push("未分类 " + formatDuration(uncategorizedMs));
        return parts.length > 1 ? parts.join("；") : (parts.length ? parts[0].split(" ")[0] : subjectLabel(entry.subject));
      }

      function subjectItemMarkup(name, timeTextValue, uncategorized) {
        return [
          '<div class="subject-item' + (uncategorized ? " uncategorized" : "") + '">',
          '<div class="subject-item-name">' + escapeHtml(name) + "</div>",
          '<div class="subject-item-time">' + timeTextValue + "</div>",
          "</div>"
        ].join("");
      }

      function renderSubjectSummary(key, studyEntries) {
        const { totals, uncategorizedMs } = subjectTotalsByEntry(studyEntries);
        const totalMs = SUBJECTS.reduce((sum, subject) => sum + (totals.get(subject) || 0), 0) + uncategorizedMs;
        subjectPanelTitle.textContent = key === dateKey(now()) ? "今日三科时间" : key + " 三科时间";
        const items = SUBJECTS.map((subject) => subjectItemMarkup(
          SUBJECT_LABELS[subject],
          formatDuration(totals.get(subject) || 0),
          false
        ));
        items.push(subjectItemMarkup("合计", formatDuration(totalMs), false));
        if (uncategorizedMs) {
          items.push(subjectItemMarkup("未分类", formatDuration(uncategorizedMs), true));
        }
        subjectSummary.innerHTML = items.join("");
      }

      function renderRecords() {
        const key = selectedDateKey();
        const entries = currentEntries();
        const studyEntries = entries.filter((entry) => normalizeKind(entry.kind) !== "meal");
        const mealEntries = entries.filter((entry) => normalizeKind(entry.kind) === "meal");
        const totalStudyMs = studyEntries.reduce((sum, entry) => sum + entryStudyMs(entry), 0);
        const totalVocabularyMs = studyEntries.reduce((sum, entry) => sum + entryVocabularyMs(entry), 0);
        const totalBreakMs = studyEntries.reduce((sum, entry) => sum + entryBreakMs(entry), 0);
        const totalDistractions = studyEntries.reduce((sum, entry) => sum + distractionCount(entry), 0);
        const totalMealMs = mealEntries.reduce((sum, entry) => sum + entryGrossMs(entry), 0);

        recordsTitle.textContent = displayDateText(key) + " 记录";
        viewDateInput.value = key;
        todayTotal.textContent = "学习净时长 " + formatDuration(totalStudyMs)
          + "｜学习休息 " + formatDuration(totalBreakMs)
          + "｜分心 " + totalDistractions + " 次｜吃饭 " + formatDuration(totalMealMs);

        recordsContainer.innerHTML = [
          '<div class="record-group">',
          '<div class="record-group-title">吃饭时间 <span>早 / 中 / 晚</span></div>',
          renderMealSummary(mealEntries),
          renderMealTable(mealEntries),
          "</div>",
          '<div class="record-group">',
          '<div class="record-group-title">学习时间 <span>和吃饭分开统计</span></div>',
          renderStudyTable(studyEntries),
          "</div>",
          '<div class="record-group">',
          '<div class="record-group-title">稍后维护 <span>只记录，不在学习中处理</span></div>',
          renderMaintenanceInbox(key),
          "</div>"
        ].join("");
        renderSubjectSummary(key, studyEntries);
        applyWriterMode();
      }

      function renderLive() {
        renderClock();
        const lastHealthyAt = guardianSync.lastAckAt || guardianPageStartedAt;
        if (
          writerLeaseOwned
          && !guardianMirrorInFlight
          && Date.now() - lastHealthyAt > GUARDIAN_WATCHDOG_MS
          && guardianSync.lastErrorCode !== "stale_revision"
        ) {
          const firstOverdue = !guardianSync.lastErrorCode;
          if (firstOverdue) {
            recordGuardianFailure("heartbeat_overdue", 0);
          }
          if (firstOverdue || guardianMirrorTimeoutId === null) {
            scheduleGuardianMirror(0);
          }
        }
        updateGuardianSyncStatus();
        if (completeCountdownIfNeeded()) {
          return;
        }
        renderTimer();
      }

      function renderAll() {
        renderLive();
        renderRecords();
        renderBlockReview();
        applyWriterMode();
      }

      function startSession(options = {}) {
        if (!timerWriteActive) { void runTimerMutation(() => startSession(options)); return; }
        const current = now();
        if (state.pendingCompletion) {
          renderBlockReview();
          setToast("请先保存上一段的实际产出和执行评价", true);
          return;
        }
        if (!state.active) {
          countdownCompletionDisplayUntil = 0;
          const currentKind = normalizeKind(state.lastKind);
          const timerMode = normalizeTimerMode(state.lastTimerMode);
          const currentMealSlot = currentKind === "meal" ? normalizeMealSlot(state.lastMealSlot) : "";
          const currentSubject = currentKind === "study" ? normalizeSubject(state.lastSubject) : "";
          if (currentKind === "study" && !currentSubject && options.allowMissingSubject !== true) {
            setToast("请先选择科目：408 / 数学 / 英语", true);
            return;
          }
          const currentTask = newEntryTask(currentKind, currentMealSlot);
          let targetMs = 0;
          if (timerMode === "countdown") {
            const countdownMinutes = Math.floor(Number(countdownMinutesInput.value));
            if (!Number.isFinite(countdownMinutes) || countdownMinutes < 1 || countdownMinutes > MAX_COUNTDOWN_MINUTES) {
              setToast("倒计时时长需要填写 1 到 " + MAX_COUNTDOWN_MINUTES + " 分钟", true);
              countdownMinutesInput.focus();
              return;
            }
            state.lastCountdownMinutes = countdownMinutes;
            targetMs = countdownMinutes * 60 * 1000;
            if (!armCountdownAlarm()) {
              setToast("当前浏览器不支持声音提醒", true);
            }
          }
          state.active = {
            blockId: createGuardianBlockId(),
            task: currentTask,
            kind: currentKind,
            timerMode,
            targetMs,
            mealSlot: currentMealSlot,
            subject: currentSubject,
            startIso: current.toISOString(),
            startMs: current.getTime(),
            runs: [{ startIso: current.toISOString(), startMs: current.getTime() }],
            pauses: [],
            vocabularySessions: [],
            currentVocabulary: null,
            distractions: [],
            pendingPauseChoice: null,
            currentPause: null
          };
          state.lastTask = currentTask;
          state.lastKind = currentKind;
          state.lastTimerMode = timerMode;
          state.lastMealSlot = currentMealSlot || state.lastMealSlot;
          if (currentKind === "study") {
            state.lastSubject = currentSubject;
          }
          if (currentKind === "meal") {
            state.lastMealTask = currentTask;
          } else {
            state.lastStudyTask = currentTask;
          }
          taskInput.value = currentTask;
          saveState();
          renderAll();
          return;
        }

        if (state.active.currentPause) {
          if (normalizeTimerMode(state.active.timerMode) === "countdown") {
            armCountdownAlarm();
          }
          const completedPause = state.active.currentPause;
          completedPause.endIso = current.toISOString();
          completedPause.endMs = current.getTime();
          completedPause.durationMs = pauseDuration(completedPause, current.getTime());
          state.active.pauses.push(completedPause);
          state.active.currentPause = null;
          state.active.runs.push({ startIso: current.toISOString(), startMs: current.getTime() });
          enqueueGuardianSignal("pause_resumed", current.getTime(), {
            transitionCode: "paused_to_running",
            sourceCode: "timer_button",
            relatedEventId: completedPause.guardianPauseEventId || "",
            userReasonCode: completedPause.reasonCode || pauseReasonCode(completedPause.reason, false)
          });
          saveState();
          renderAll();
        }
      }

      function startVocabularyInterlude() {
        if (!timerWriteActive) { void runTimerMutation(() => startVocabularyInterlude()); return; }
        if (
          !state.active
          || normalizeKind(state.active.kind) !== "study"
          || !isRunning()
        ) {
          return;
        }
        if (completeCountdownIfNeeded()) {
          return;
        }
        const current = now();
        const lastRun = state.active.runs[state.active.runs.length - 1];
        if (lastRun && typeof lastRun.endMs !== "number") {
          lastRun.endIso = current.toISOString();
          lastRun.endMs = current.getTime();
        }
        state.active.currentVocabulary = {
          startIso: current.toISOString(),
          startMs: current.getTime()
        };
        if (!saveState()) {
          renderAll();
          return;
        }
        renderAll();
        setToast("原学习块已暂停，开始记录背单词");
      }

      function resumeFromVocabularyInterlude() {
        if (!timerWriteActive) { void runTimerMutation(() => resumeFromVocabularyInterlude()); return; }
        if (!state.active || !state.active.currentVocabulary) {
          return;
        }
        const current = now();
        const completedVocabulary = {
          ...state.active.currentVocabulary,
          endIso: current.toISOString(),
          endMs: current.getTime(),
          durationMs: vocabularyDuration(state.active.currentVocabulary, current.getTime())
        };
        state.active.vocabularySessions = normalizeVocabularySessions([
          ...(state.active.vocabularySessions || []),
          completedVocabulary
        ]);
        state.active.currentVocabulary = null;
        state.active.runs.push({
          startIso: current.toISOString(),
          startMs: current.getTime()
        });
        if (normalizeTimerMode(state.active.timerMode) === "countdown") {
          armCountdownAlarm();
        }
        if (!saveState()) {
          renderAll();
          return;
        }
        renderAll();
        setToast("背词 " + formatDuration(completedVocabulary.durationMs) + " 已计入学习，原任务继续计时");
      }

      function toggleVocabularyInterlude() {
        if (isVocabularyActive()) {
          resumeFromVocabularyInterlude();
          return;
        }
        startVocabularyInterlude();
      }

      function pauseSession() {
        if (!timerWriteActive) { void runTimerMutation(() => pauseSession()); return; }
        if (!state.active || !isRunning()) {
          return;
        }
        if (completeCountdownIfNeeded()) {
          return;
        }
        const current = now();
        const lastRun = state.active.runs[state.active.runs.length - 1];
        if (lastRun && typeof lastRun.endMs !== "number") {
          lastRun.endIso = current.toISOString();
          lastRun.endMs = current.getTime();
        }
        const pauseEventId = enqueueGuardianSignal("pause_started", current.getTime(), {
          transitionCode: "running_to_paused",
          sourceCode: "timer_button"
        });
        state.active.pendingPauseChoice = {
          startIso: current.toISOString(),
          startMs: current.getTime(),
          guardianEventId: pauseEventId
        };
        saveState();
        renderAll();
      }

      function choosePauseReason(reason, options = {}) {

        if (!state.active || !state.active.pendingPauseChoice) {

        const pendingPause = state.active.pendingPauseChoice;
        const reasonCode = pauseReasonCode(reason, options.custom === true);
        state.active.currentPause = {

        };

          transitionCode: "paused_reason_selected",
          sourceCode: "timer_button",

          userReasonCode: reasonCode
        });
        saveState();
        renderAll();
      }

      function submitCustomPauseReason() {
        const reason = String(customPauseReasonInput.value || "").trim();
        if (!reason) {

      function openActiveEditor(mode) {

          return;

          setToast("当前没有可修改的暂停原因", true);

        } else {
          const isMeal = normalizeKind(state.active.kind) === "meal";
          activeEditTitle.textContent = isMeal ? "修改事项" : "修改学习标题";
          activeEditLabel.textContent = isMeal ? "事项" : "学习标题";
          activeEditInput.value = state.active.task || "";
        }
        activeEditError.textContent = "";
        activeEditModal.hidden = false;

      function closeActiveEditor() {

        activeEditInput.value = "";

      function saveActiveEditor() {
        if (!timerWriteActive) { void runTimerMutation(() => saveActiveEditor()); return; }
        if (!state.active || !activeEditMode) {
          closeActiveEditor();
          return;
        }
        const value = String(activeEditInput.value || "").trim();

          if (relatedPauseEventId) {
            enqueueGuardianSignal("pause_reason_selected", Date.now(), {
              transitionCode: "paused_reason_selected",
              sourceCode: "timer_button",
              relatedEventId: relatedPauseEventId,
              userReasonCode: "custom_private"
            });
          }
          message = "已修改暂停原因";
        } else {

          state.lastTask = value;
          if (normalizeKind(state.active.kind) === "meal") {
            state.lastMealTask = value;
          } else {
            state.lastStudyTask = value;
          }

          message = "已修改当前标题";

      function recordDistraction(atMs, options = {}) {
        if (!timerWriteActive) { void runTimerMutation(() => recordDistraction(atMs, options)); return "pending"; }
        if (!ensureWriterLease()) {
          return "temporarily_unavailable";
        }
        if (!state.active || normalizeKind(state.active.kind) !== "study" || !isRunning()) {
          return "not_applicable";
        }
        const requestedMs = Number(atMs);
        const currentMs = Number.isFinite(requestedMs) ? Math.round(requestedMs) : Date.now();
        const stableEventId = String(options.eventId || "");
        if (
          stableEventId
          && normalizeDistractions(state.active.distractions).some(
            (distraction) => distraction.guardianEventId === stableEventId
          )
        ) {
          return "already_recorded";
        }
        const lastRun = state.active.runs[state.active.runs.length - 1];
        if (!lastRun || currentMs < lastRun.startMs) {
          return "not_applicable";
        }
        if (currentMs > Date.now() + 5000) {
          return "temporarily_unavailable";
        }
        const current = new Date(currentMs);
        state.active.distractions = normalizeDistractions(state.active.distractions);
        const eventId = stableEventId || createGuardianEventId();
        state.active.distractions.push({
          atIso: current.toISOString(),
          atMs: currentMs,
          guardianEventId: eventId
        });
        enqueueGuardianSignal("distraction_recorded", currentMs, {
          eventId,
          transitionCode: "running_to_running",
          sourceCode: options.sourceCode || "timer_button",
          distractionOrdinal: state.active.distractions.length
        });
        if (!saveState()) {
          return "temporarily_unavailable";
        }
        renderTimer();
        distractionBtn.classList.remove("recorded");
        void distractionBtn.offsetWidth;
        distractionBtn.classList.add("recorded");
        window.clearTimeout(recordDistraction.timer);
        recordDistraction.timer = window.setTimeout(() => distractionBtn.classList.remove("recorded"), 520);
        setToast("已记录分心：" + timeText(current));
        return "recorded";
      }

      function saveGlobalShortcutCursor() {
        if (timerWriteActive) { timerWriteCursorDirty = true; return; }
        writeGlobalShortcutCursor();
      }

      function writeGlobalShortcutCursor() {
        if (!globalShortcutSessionId) {
          return;
        }
        localStorage.setItem(GLOBAL_SHORTCUT_CURSOR_KEY, JSON.stringify({
          sessionId: globalShortcutSessionId,
          lastEventId: globalShortcutLastEventId
        }));
      }

      function loadGlobalShortcutCursor(sessionId) {
        globalShortcutSessionId = sessionId;
        globalShortcutLastEventId = 0;
        try {
          const stored = JSON.parse(localStorage.getItem(GLOBAL_SHORTCUT_CURSOR_KEY) || "null");
          if (stored && stored.sessionId === sessionId && Number.isFinite(Number(stored.lastEventId))) {
            globalShortcutLastEventId = Math.max(0, Math.floor(Number(stored.lastEventId)));
          }
        } catch (error) {
          globalShortcutLastEventId = 0;
        }
      }

      function receiveGlobalDistractionEvents(payload) {
        if (!timerWriteActive) { void runTimerMutation(() => receiveGlobalDistractionEvents(payload)); return; }
        if (!ensureWriterLease()) {
          return;
        }
        if (!payload || typeof payload.sessionId !== "string" || !Array.isArray(payload.events)) {
          return;
        }
        const safeSessionId = payload.sessionId.replace(/[^A-Za-z0-9._-]/g, "").slice(0, 96);
        if (!safeSessionId) {
          return;
        }
        if (globalShortcutSessionId !== safeSessionId) {
          loadGlobalShortcutCursor(safeSessionId);
        }

        const events = payload.events
          .map((item) => {
            const id = Math.floor(Number(item && item.id));
            return {
              id,
              atMs: Number(item && item.atMs),
              eventId: "hs-" + safeSessionId + "-" + id
            };
          })
          .filter((item) => Number.isFinite(item.id) && item.id > globalShortcutLastEventId && Number.isFinite(item.atMs))
          .sort((left, right) => left.id - right.id);

        for (const item of events) {
          const outcome = recordDistraction(item.atMs, {
            eventId: item.eventId,
            sourceCode: "hammerspoon_right_option"
          });
          if (!["recorded", "already_recorded", "not_applicable"].includes(outcome)) {
            break;
          }
          globalShortcutLastEventId = Math.max(globalShortcutLastEventId, item.id);
        }
        saveGlobalShortcutCursor();
      }

      function resetGlobalShortcutLoad() {
        window.clearTimeout(globalShortcutLoadTimeoutId);
        globalShortcutLoadTimeoutId = null;
        globalShortcutLoadInFlight = false;
        if (globalShortcutScript) {
          globalShortcutScript.remove();
          globalShortcutScript = null;
        }
      }

      function pollGlobalShortcutSignal() {
        if (!writerLeaseOwned || globalShortcutLoadInFlight) {
          return;
        }
        globalShortcutLoadInFlight = true;
        const script = document.createElement("script");
        const complete = () => {
          if (globalShortcutScript === script) {
            resetGlobalShortcutLoad();
          } else {
            script.remove();
          }
        };
        globalShortcutScript = script;
        script.src = GLOBAL_SHORTCUT_SIGNAL_FILE + "?v=" + Date.now();
        script.async = true;
        script.addEventListener("load", complete, { once: true });
        script.addEventListener("error", complete, { once: true });
        globalShortcutLoadTimeoutId = window.setTimeout(complete, GLOBAL_SHORTCUT_LOAD_TIMEOUT_MS);
        document.head.appendChild(script);
      }

      window.receiveGlobalDistractionEvents = receiveGlobalDistractionEvents;

      function handleDistractionShortcut(event) {
        if (event.code !== "AltRight" || event.repeat || rightOptionDown || event.metaKey || event.ctrlKey || event.shiftKey) {
          return;
        }
        rightOptionDown = true;
        if (!activeEditModal.hidden || !editModal.hidden) {
          return;
        }
        const target = event.target;
        const tagName = String(target && target.tagName || "").toLowerCase();
        if (["input", "textarea", "select"].includes(tagName) || Boolean(target && target.isContentEditable)) {
          return;
        }
        if (["recorded", "already_recorded", "pending"].includes(recordDistraction())) {
          event.preventDefault();
          event.stopPropagation();
        }
      }

      function releaseDistractionShortcut(event) {
        if (event.code === "AltRight") {
          rightOptionDown = false;
        }
      }

      function endSession(requestedEndMs, options = {}) {
        if (!timerWriteActive) { void runTimerMutation(() => endSession(requestedEndMs, options)); return; }
        if (!state.active || state.active.pendingPauseChoice || state.active.currentVocabulary) {
          return;
        }
        const endedWhileRunning = isRunning();
        const parsedEndMs = Number(requestedEndMs);
        const endMs = Math.max(
          state.active.startMs,
          Number.isFinite(parsedEndMs) ? parsedEndMs : Date.now()
        );
        const current = new Date(endMs);
        const endIso = current.toISOString();
        const pauses = state.active.pauses.slice();
        const timerMode = normalizeTimerMode(state.active.timerMode);
        const targetMs = timerMode === "countdown" ? normalizeTargetMs(state.active.targetMs) : 0;

        if (state.active.currentPause) {
          state.active.currentPause.endIso = endIso;
          state.active.currentPause.endMs = endMs;
          state.active.currentPause.durationMs = pauseDuration(state.active.currentPause, endMs);
          pauses.push(state.active.currentPause);
        } else {
          const lastRun = state.active.runs[state.active.runs.length - 1];
          if (lastRun && typeof lastRun.endMs !== "number") {
            lastRun.endIso = current.toISOString();
            lastRun.endMs = current.getTime();
          }
        }

        const vocabularySessions = normalizeVocabularySessions(state.active.vocabularySessions);
        const primaryStudyMs = state.active.runs.reduce((sum, run) => sum + runDuration(run, run.endMs), 0);
        const vocabularyMs = vocabularySessions.reduce(
          (sum, session) => sum + vocabularyDuration(session, session.endMs),
          0
        );
        const studyMs = primaryStudyMs + vocabularyMs;
        const breakMs = pauses.reduce((sum, pause) => sum + pauseDuration(pause, pause.endMs), 0);
        const grossMs = Math.max(0, endMs - state.active.startMs);
        const entry = {
          id: String(Date.now()),
          blockId: state.active.blockId,
          task: state.active.task,
          kind: normalizeKind(state.active.kind),
          timerMode,
          targetMs,
          countdownCompleted: timerMode === "countdown" && Boolean(options.countdownComplete),
          endedWhileRunning,
          mealSlot: normalizeKind(state.active.kind) === "meal" ? normalizeMealSlot(state.active.mealSlot) : "",
          subject: normalizeKind(state.active.kind) === "study" ? normalizeSubject(state.active.subject) : "",
          startIso: state.active.startIso,
          endIso,
          startMs: state.active.startMs,
          endMs,
          grossMs,
          studyMs,
          primaryStudyMs,
          vocabularyMs,
          breakMs,
          durationMs: studyMs,
          pauses,
          vocabularySessions,
          distractions: normalizeDistractions(state.active.distractions),
          actualOutput: "",
          selfEvaluation: ""
        };
        const key = dateKey(new Date(entry.startIso));
        state.selectedDateKey = key;
        if (options.countdownComplete) {
          countdownCompletionDisplayUntil = Date.now() + 5000;
        }
        state.active = null;
        if (normalizeKind(entry.kind) === "study") {
          state.pendingCompletion = {
            entry,
            countdownComplete: Boolean(options.countdownComplete),
            createdAtIso: new Date().toISOString()
          };
        } else {
          state.entriesByDate[key] = state.entriesByDate[key] || [];
          state.entriesByDate[key].push(entry);
        }
        if (!saveState()) {
          renderAll();
          return;
        }
        renderAll();
        if (options.countdownComplete) {
          playCountdownAlarm();
          setToast(normalizeKind(entry.kind) === "study" ? "倒计时结束，请填写本段复盘" : "倒计时结束，已保存本段记录");
        } else if (normalizeKind(entry.kind) === "study") {
          setToast("请填写本段实际产出和执行评价");
        }
      }

      function saveBlockReview() {
        if (!timerWriteActive) { void runTimerMutation(() => saveBlockReview()); return; }
        if (!state.pendingCompletion) {
          renderBlockReview();
          return;
        }
        const actualOutput = normalizeActualOutput(blockReviewOutput.value);
        if (!actualOutput) {

          return;

          blockReviewError.textContent = "请选择本段的执行评价";

        const entry = normalizeEntry({
          ...state.pendingCompletion.entry,
