        });
        const key = dateKey(new Date(entry.startIso));
        const existing = state.entriesByDate[key] || [];
        const existingIndex = existing.findIndex((candidate) => candidate.id === entry.id);
        if (existingIndex >= 0) {
          existing[existingIndex] = entry;
        } else {
          existing.push(entry);
        }
        state.entriesByDate[key] = existing;
        state.selectedDateKey = key;
        state.pendingCompletion = null;
        if (!saveState()) {
          renderAll();
          return;
        }
        reviewingEntryId = null;
        selectedSelfEvaluation = "";
        blockReviewOutput.value = "";
        blockReviewError.textContent = "";
        renderAll();

      }

      function dateWithTime(baseDate, value) {
        const match = /^(\d{1,2}):(\d{2})$/.exec(String(value || "").trim());
        if (!match) {
          return null;
        }
        const hour = Number(match[1]);
        const minute = Number(match[2]);
        if (hour > 23 || minute > 59) {
          return null;
        }
        return new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), hour, minute, 0, 0);
      }

      function parsePauseLines(text, baseDate, startMs, endMs) {
        const lines = String(text || "").split("\n").map((line) => line.trim()).filter(Boolean);
        const pauses = [];
        for (const line of lines) {
          const match = /^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})\s+(.+)$/.exec(line);
          if (!match) {
            throw new Error("暂停明细格式错误：" + line);
          }
          const start = dateWithTime(baseDate, match[1]);
          const end = dateWithTime(baseDate, match[2]);
          const reason = safeTask(match[3]);
          if (!start || !end || end.getTime() <= start.getTime()) {
            throw new Error("暂停时间不成立：" + line);
          }
          if (start.getTime() < startMs || end.getTime() > endMs) {
            throw new Error("暂停时间必须在学习时间段内：" + line);
          }
          pauses.push({
            reason,
            startIso: start.toISOString(),
            endIso: end.toISOString(),
            startMs: start.getTime(),
            endMs: end.getTime(),
            durationMs: end.getTime() - start.getTime()
          });
        }
        return pauses;
      }

      function parseVocabularyLines(text, baseDate, startMs, endMs) {
        const lines = String(text || "").split("\n").map((line) => line.trim()).filter(Boolean);
        const sessions = [];
        for (const line of lines) {
          const match = /^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})(?:\s+背单词)?$/.exec(line);
          if (!match) {
            throw new Error("背词插曲格式错误：" + line);
          }
          const start = dateWithTime(baseDate, match[1]);
          const end = dateWithTime(baseDate, match[2]);
          if (!start || !end || end.getTime() <= start.getTime()) {
            throw new Error("背词时间不成立：" + line);
          }
          if (start.getTime() < startMs || end.getTime() > endMs) {
            throw new Error("背词时间必须在学习时间段内：" + line);
          }
          sessions.push({
            startIso: start.toISOString(),
            endIso: end.toISOString(),
            startMs: start.getTime(),
            endMs: end.getTime(),
            durationMs: end.getTime() - start.getTime()
          });
        }
        return normalizeVocabularySessions(sessions);
      }

      function intervalsOverlap(left, right) {
        return left.startMs < right.endMs && right.startMs < left.endMs;
      }

      function validateIntervals(pauses, vocabularySessions) {
        const sortedPauses = pauses.slice().sort((left, right) => left.startMs - right.startMs);
        const sortedVocabulary = vocabularySessions.slice().sort((left, right) => left.startMs - right.startMs);
        for (let index = 1; index < sortedPauses.length; index += 1) {
          if (intervalsOverlap(sortedPauses[index - 1], sortedPauses[index])) {
            throw new Error("暂停明细之间不能重叠");
          }
        }
        for (let index = 1; index < sortedVocabulary.length; index += 1) {
          if (intervalsOverlap(sortedVocabulary[index - 1], sortedVocabulary[index])) {
            throw new Error("背词插曲之间不能重叠");
          }
        }
        for (const pause of sortedPauses) {
          if (sortedVocabulary.some((session) => intervalsOverlap(pause, session))) {
            throw new Error("背词时间不能和暂停休息重叠");
          }
        }
      }

      function saveEdit() {
        if (!timerWriteActive) { void runTimerMutation(() => saveEdit()); return; }
        const entry = findEntry(editingId);
        if (!entry) {
          closeEdit();
          return;
        }
        const baseDate = new Date(entry.startIso);
        const start = dateWithTime(baseDate, editStart.value);
        const end = dateWithTime(baseDate, editEnd.value);
        if (!start || !end || end.getTime() <= start.getTime()) {
          setToast("开始/结束时间不成立", true);
          return;
        }
        const kind = normalizeKind(editKind.value);
        let pauses;
        let vocabularySessions;
        try {
          pauses = parsePauseLines(editPauses.value, baseDate, start.getTime(), end.getTime());
          vocabularySessions = kind === "study"
            ? parseVocabularyLines(editVocabulary.value, baseDate, start.getTime(), end.getTime())
            : [];
          validateIntervals(pauses, vocabularySessions);
        } catch (error) {
          setToast(error.message, true);
          return;
        }
        const breakMs = pauses.reduce((sum, pause) => sum + pause.durationMs, 0);
        const vocabularyMs = vocabularySessions.reduce((sum, session) => sum + session.durationMs, 0);
        const grossMs = end.getTime() - start.getTime();
        const studyMs = Math.max(0, grossMs - breakMs);
        const primaryStudyMs = Math.max(0, studyMs - vocabularyMs);
        entry.task = safeTask(editTask.value);
        entry.kind = kind;
        entry.mealSlot = kind === "meal" ? normalizeMealSlot(editMealSlot.value) : "";
        entry.subject = kind === "study" ? normalizeSubject(editSubject.value) : "";
        entry.startIso = start.toISOString();
        entry.endIso = end.toISOString();
        entry.startMs = start.getTime();
        entry.endMs = end.getTime();
        entry.grossMs = grossMs;
        entry.breakMs = breakMs;
        entry.studyMs = studyMs;
        entry.primaryStudyMs = primaryStudyMs;
        entry.vocabularyMs = vocabularyMs;
        entry.durationMs = studyMs;
        entry.pauses = pauses;
        entry.vocabularySessions = vocabularySessions;
        entry.actualOutput = kind === "study" ? normalizeActualOutput(editOutput.value) : "";
        entry.selfEvaluation = kind === "study" ? normalizeSelfEvaluation(editEvaluation.value) : "";
        delete entry.pauseReason;
        saveState();
        closeEdit();
        renderAll();
        setToast("已保存修改");
      }

      function buildMarkdown() {
        const key = selectedDateKey();
        const entries = currentEntries();
        const studyEntries = entries.filter((entry) => normalizeKind(entry.kind) !== "meal");
        const mealEntries = entries.filter((entry) => normalizeKind(entry.kind) === "meal");
        const maintenanceItems = maintenanceItemsForDate(key);
        const totalStudyMs = studyEntries.reduce((sum, entry) => sum + entryStudyMs(entry), 0);
        const totalVocabularyMs = studyEntries.reduce((sum, entry) => sum + entryVocabularyMs(entry), 0);
        const totalBreakMs = studyEntries.reduce((sum, entry) => sum + entryBreakMs(entry), 0);
        const totalDistractions = studyEntries.reduce((sum, entry) => sum + distractionCount(entry), 0);
        const totalMealMs = mealEntries.reduce((sum, entry) => sum + entryGrossMs(entry), 0);
        const lines = [
          "## " + key + " 计时记录",
          "",
          "### 吃饭",
          "",
          "| 餐次 | 时间段 | 用时 | 备注 |",
          "| --- | --- | ---: | --- |"
        ];

        for (const slot of MEAL_SLOTS) {
          const slotEntries = mealEntries
            .filter((entry) => normalizeMealSlot(entry.mealSlot) === slot)
            .sort((a, b) => a.startMs - b.startMs);
          if (!slotEntries.length) {
            lines.push("| " + MEAL_SLOT_LABELS[slot] + " | 未记录 |  |  |");
            continue;
          }
          for (const entry of slotEntries) {
            const task = String(entry.task || "").replaceAll("|", "\\|");
            lines.push("| " + MEAL_SLOT_LABELS[slot] + " | " + timeRangeText(entry) + " | " + formatDuration(entryGrossMs(entry)) + " | " + task + " |");
          }
        }

        lines.push("| 合计 |  | " + formatDuration(totalMealMs) + " |  |");
        lines.push(
          "",
          "### 学习",
          "",
          "| 时间段 | 科目 | 总窗口 | 净学习 | 背词插曲 | 休息 | 任务 | 实际产出 | 执行自评 | 分心记录 | 暂停明细 |",
          "| --- | --- | ---: | ---: | --- | ---: | --- | --- | --- | --- | --- |"
        );

        for (const entry of studyEntries) {
          const task = String(entry.task || "未标注任务").replaceAll("|", "\\|");
          const actualOutput = String(entry.actualOutput || "未填写").replaceAll("|", "\\|");
          const selfEvaluation = selfEvaluationLabel(entry.selfEvaluation);
          const distractions = distractionSummary(entry).replaceAll("|", "\\|");
          const vocabulary = vocabularySummary(entry).replaceAll("|", "\\|");
          const pauses = pauseSummary(entry).replaceAll("|", "\\|");
          lines.push("| " + timeRangeText(entry) + " | " + entrySubjectSummary(entry) + " | " + formatDuration(entryGrossMs(entry)) + " | " + formatDuration(entryStudyMs(entry)) + " | " + vocabulary + " | " + formatDuration(entryBreakMs(entry)) + " | " + task + " | " + actualOutput + " | " + selfEvaluation + " | " + distractions + " | " + pauses + " |");
        }

        lines.push("| 合计 |  |  | " + formatDuration(totalStudyMs) + " | " + formatDuration(totalVocabularyMs) + " | " + formatDuration(totalBreakMs) + " |  |  |  | " + totalDistractions + " 次 |  |");

        const subjectTotals = subjectTotalsByEntry(studyEntries);
        lines.push("", "### 三科时间", "");
        for (const subject of SUBJECTS) {
          lines.push("- " + SUBJECT_LABELS[subject] + "：" + formatDuration(subjectTotals.totals.get(subject) || 0));
        }
        if (subjectTotals.uncategorizedMs) {
          lines.push("- 未分类：" + formatDuration(subjectTotals.uncategorizedMs));
        }

        lines.push("", "### 稍后维护", "");
        if (!maintenanceItems.length) {
          lines.push("- 无");
        } else {
          for (const item of maintenanceItems) {
            const title = item.title.replaceAll("\n", " ");
            const task = item.task.replaceAll("\n", " ");
            const note = item.note ? "｜" + item.note.replaceAll("\n", " ") : "";
            lines.push("- " + timeText(new Date(item.createdAt)) + "｜" + task + "｜" + title + note);
          }
        }

        if (state.active && dateKey(new Date(state.active.startIso)) === key) {
          lines.push("");
          const start = new Date(state.active.startIso);
          let status = "仍在计时";
          if (state.active.pendingPauseChoice) {
            status = "已暂停，待选择原因";
          } else if (state.active.currentPause) {
            status = "暂停中：" + state.active.currentPause.reason;
          } else if (state.active.currentVocabulary) {
            status = "背单词中，原任务已暂停";
          }
          const activeDistractions = distractionCount(state.active);
          const distractionStatus = normalizeKind(state.active.kind) === "study" ? "，已记录分心 " + activeDistractions + " 次" : "";
          lines.push("> 当前" + status + "：" + shortTimeText(start) + " 开始，" + entryLabel(state.active) + "：" + state.active.task.replaceAll("|", "\\|") + distractionStatus);
        }

        return lines.join("\n");
      }

      function buildCloseoutProjection() {
        const key = selectedDateKey();
        const entries = currentEntries();
        const studyEntries = entries
          .filter((entry) => normalizeKind(entry.kind) !== "meal")

          .sort((left, right) => left.startMs - right.startMs);

        return {
          schema: "left_screen_daily_closeout_v1",
          date: key,
          generated_at: new Date().toISOString(),
          summary: {
            completed_blocks: studyEntries.length,
            gross_ms: studyEntries.reduce((sum, entry) => sum + entryGrossMs(entry), 0),

          }))
        };
      }

      async function copyText(text, successMessage) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          setToast(successMessage);
          return;
        }
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
        setToast(successMessage);
      }

        }
      });
      document.addEventListener("freeze", suspendRuntime);
      document.addEventListener("resume", resumeRuntime);
      window.addEventListener("storage", (event) => {
        if (event.key === GUARDIAN_SYNC_KEY) {
          guardianSync = loadGuardianSync();
          updateGuardianSyncStatus();
          return;
        }
        if (event.key === WRITER_LEASE_KEY) {
          const wasWriter = writerLeaseOwned;
          writerLeaseOwned = currentTabOwnsWriterLease();
          if (!writerLeaseOwned && wasWriter) {
            state = loadState();
            resetGlobalShortcutLoad();
          }
          if (writerLeaseOwned !== wasWriter) {
            renderAll();
          } else {
            updateGuardianSyncStatus();
          }
          return;
        }
        if (event.key === MAINTENANCE_INBOX_KEY) {
          maintenanceInbox = loadMaintenanceInbox();
          renderRecords();
          return;
        }
        if (event.key !== STORAGE_KEY || !event.newValue) {
          return;
        }
        const previousRevision = Number(state.guardianRevision || 0);
        state = loadState();
        renderAll();
        if (writerLeaseOwned && Number(state.guardianRevision || 0) !== previousRevision) {
          scheduleGuardianMirror(0);
        }
      });
    }());
  </script>
</body>
</html>
